name: deploy r28
on:
  push:
    paths:
      - '.deploy-r28/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .deploy-r28/patch_form.py
      - name: Verify
        run: |
          python3 - <<'PY'
          import io
          s = io.open('form/index.html', encoding='utf-8').read()
          assert "h += '<tr class=\"att-head\">'" not in s, 'preview head row still present'
          assert s.count('class="att-tbl"') == 1, 'att-tbl count: %d' % s.count('class="att-tbl"')
          for k in ['契約項次', '項目及說明', '查驗數量', '監造覆核']:
              assert k in s, 'missing field label: ' + k
          assert s.count('class="design"') == 9, 'design rows: %d' % s.count('class="design"')

          f = io.open('form/formbuilder.js', encoding='utf-8').read()
          assert 'mkCell(doc,c.label,c.w,"center",28,!1,1,ATT_H.head)' not in f, 'docx head row still present'
          assert 'ATT_H.head' in f, 'ATT_H.head const should remain'
          assert 'buildAttachmentFooter' in f, 'footer missing'
          assert 'buildPhotoGrid' in f, 'photo grid missing'
          print('OK', len(s.encode('utf-8')), len(f.encode('utf-8')))
          PY
      - name: Commit
        run: |
          git config user.name "Super Agent"
          git config user.email "agent@teamily.ai"
          if git diff --quiet form/index.html form/formbuilder.js; then
            echo "no change"
          else
            git add form/index.html form/formbuilder.js
            git commit -m "feat(form): 查驗單附件表格移除表頭列（預覽與 Word 輸出一致）"
            git push origin main
          fi
