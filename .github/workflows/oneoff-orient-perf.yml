name: oneoff-orient-perf
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oneoff-orient-perf.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply optimisation
        run: |
          cat > /tmp/tg.b64 <<'TGEOF'

TGEOF
          cat > /tmp/cp.b64 <<'CPEOF'

CPEOF
          base64 -d /tmp/tg.b64 > /tmp/tg.js
          base64 -d /tmp/cp.b64 > /tmp/cp.js
          python3 - <<'PYEOF'
import io
src = open('assets/orient.js', encoding='utf-8').read()
orig_len = len(src)
togray_new = open('/tmp/tg.js', encoding='utf-8').read()
comp_new = open('/tmp/cp.js', encoding='utf-8').read()

start = src.find('  function toGray(imgEl, srcW, srcH) {')
assert start >= 0, 'toGray not found'
pre = src.rfind('  /* ---------------- \u5f71\u50cf \u2192 \u7070\u968e ---------------- */', 0, start)
if pre < 0:
    pre = start
end_marker = '    return { gray: gray, w: w, h: h };\n  }\n'
end = src.find(end_marker, start)
assert end >= 0, 'toGray end not found'
end += len(end_marker)
head = src[:pre] + '  /* ---------------- \u5f71\u50cf \u2192 \u7070\u968e ---------------- */\n\n'
src = head + togray_new + '\n' + src[end:]

start = src.find('  function components(mask, w, h) {')
assert start >= 0, 'components not found'
end_marker = '    return out;\n  }\n'
end = src.find(end_marker, start)
assert end >= 0, 'components end not found'
end += len(end_marker)
src = src[:start] + comp_new + '\n' + src[end:]

old_call = '    var f = uprightFeats(inkUp.mask, inkUp.w, inkUp.h);'
new_call = ('    /* \u53ea\u53d6\u300c\u5b57\u5143\u6578\u300d\u7576\u8a3a\u65b7\u503c\u3002cent\uff0fflat\uff0fvotes \u662f\u820a\u7248\u5b57\u5f62\u7d71\u8a08\u7684\u6b98\u7559\uff0c\n'
            '       \u5f9e\u672a\u53c3\u8207\u5224\u65b7\uff08\u5224\u65b7\u53ea\u7528\u7248\u9762\u7d50\u69cb\u8207\u65e5\u671f\u5b57\u6a23\uff09\uff0c\u6545\u4e0d\u518d\u8a08\u7b97\u2014\u2014\n'
            '       \u539f\u672c\u9019\u88e1\u8981\u8dd1\u4e00\u6b21\u5168\u5716\u5217\u6295\u5f71 + \u5169\u6b21\u6392\u5e8f\uff0c\u662f\u6700\u5927\u7684\u55ae\u4e00\u8017\u6642\u4f86\u6e90\u3002 */\n'
            '    var f = { glyphs: components(inkUp.mask, inkUp.w, inkUp.h).length, cent: 0, flat: 0, votes: 0 };')
assert old_call in src, 'uprightFeats call not found'
src = src.replace(old_call, new_call, 1)

open('assets/orient.js','w',encoding='utf-8').write(src)
print('orig', orig_len, '-> new', len(src))
PYEOF
          node -e "new Function(require('fs').readFileSync('assets/orient.js','utf8')); console.log('syntax ok')"
      - name: Commit
        run: |
          git config user.name dodafga
          git config user.email dodafga@users.noreply.github.com
          git diff --stat
          git add -A
          git commit -m "perf(orient): remove dead glyph-stats compute, run-based CCL, reuse canvas, int buffers"
          git push origin HEAD:main
      - name: Self remove
        run: |
          git rm -f .github/workflows/oneoff-orient-perf.yml
          git commit -m "chore: remove one-off workflow"
          git push origin HEAD:main
