name: oneoff-drive-delete-wm
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oneoff-drive-delete-wm.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply
        run: |
          set -e
          B="https://static.teamily.ai/sites/37eb832d-9280-41aa-bf49-25ff6910a93a/documents/pe-deploy3"
          T="?tk=c2l0ZTozN2ViODMyZC05MjgwLTQxYWEtYmY0OS0yNWZmNjkxMGE5M2EvZG9jdW1lbnRzL3BlLWRlcGxveTM6MTc5NDU0MzgzOQ.ZTQwYTZmNDU5Y2FkMTc1YjAwMWY4NTYzZTY0MjNkMTM"
          curl -fsSL -o assets/gdrive.js        "$B/gdrive.js$T"
          curl -fsSL -o assets/gdrive-photo.js  "$B/gdrive-photo.js$T"
          curl -fsSL -o assets/drive-page.js    "$B/drive-page.js$T"
          curl -fsSL -o assets/drive-page.css   "$B/drive-page.css$T"
          echo '--- sizes ---'
          for f in assets/gdrive.js assets/gdrive-photo.js assets/drive-page.js assets/drive-page.css; do echo "$f: $(wc -c < $f)"; done
          node --check assets/gdrive.js
          node --check assets/gdrive-photo.js
          node --check assets/drive-page.js
          echo "deleteFile=$(grep -c 'function deleteFile' assets/gdrive.js) updateFileContent=$(grep -c 'function updateFileContent' assets/gdrive.js) applyWmAfter=$(grep -c 'function applyWatermarkAfterUpload' assets/gdrive-photo.js) data-del=$(grep -c 'data-del' assets/drive-page.js) watermarkFalse=$(grep -c 'watermark: false' assets/drive-page.js)"
          md5sum assets/gdrive.js assets/gdrive-photo.js assets/drive-page.js assets/drive-page.css
          git config user.name dodafga
          git config user.email dodafga@users.noreply.github.com
          git add -A
          git commit -m "feat(drive): delete uploaded photos + apply date watermark after upload"
          git push
      - name: Self delete
        if: always()
        run: |
          git pull --rebase || true
          git rm -f .github/workflows/oneoff-drive-delete-wm.yml || true
          git commit -m "chore: remove one-off workflow" || true
          git push || true
