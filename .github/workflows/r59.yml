name: r59 apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r59.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and place files
        run: |
          set -e
          curl -fsSL https://paste.rs/gCXXd -o build/index.html
          curl -fsSL https://paste.rs/3AXL7 -o assets/assistant.js
          curl -fsSL https://paste.rs/84Ki8 -o assets/site.css
          echo "--- sizes ---"
          wc -c build/index.html assets/assistant.js assets/site.css
          echo "--- sha256 ---"
          sha256sum build/index.html assets/assistant.js assets/site.css
          echo "--- sanity ---"
          grep -c 'pendBox' build/index.html
          grep -c 'vpresetRender' assets/assistant.js
          grep -c 'pendbox' assets/site.css
          node --check assets/assistant.js && echo "JS OK"
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add build/index.html assets/assistant.js assets/site.css
          git commit -m "營造助手：常用廠商一鍵套用、已就緒圖片直接進暫存區、拍照可一次多張再一次加入暫存區"
          git push
      - name: Self delete workflow
        run: |
          set -e
          git rm .github/workflows/r59.yml
          git commit -m "chore: remove one-time r59 workflow"
          git push
