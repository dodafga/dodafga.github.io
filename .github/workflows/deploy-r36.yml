name: deploy-r36
on:
  push:
    paths:
      - '.deploy-r36/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch patch
        run: |
          set -e
          curl -sSL -o /tmp/drive.patch https://paste.rs/UiVex
          echo "997ab2afa95faeb88c3b119d1df3ad44a57295cc34ce9dbf819fe9ed072140d8  /tmp/drive.patch" | sha256sum -c -
      - name: Apply
        run: |
          set -e
          git apply --whitespace=nowarn /tmp/drive.patch
          sha256sum drive/index.html assets/drive-v2.js assets/drive-v2.css assets/drive-page.js
      - name: Verify
        run: |
          set -e
          test "$(sha256sum drive/index.html | cut -d' ' -f1)" = "f2b000b878759b1857c649df74e40ce432769e931444adc6ecd44f26d69f31f2"
          test "$(sha256sum assets/drive-v2.js | cut -d' ' -f1)" = "b3c730597517d2e835090b5656c4a7e83e7a67757cbeb12fc20f6f8602af542a"
          test "$(sha256sum assets/drive-v2.css | cut -d' ' -f1)" = "ef30c4ee89c9e42857825b82604dd5e062186e9ee9a6f98e5abbc99355bfab0c"
          test "$(sha256sum assets/drive-page.js | cut -d' ' -f1)" = "836fc828858a506f10bd19581506266c238369e076cc3856bdbe8ada666b6e1a"
          echo OK
      - name: Commit
        run: |
          set -e
          git config user.name 'Teamily Agent'
          git config user.email 'agent@teamily.ai'
          git add drive/index.html assets/drive-v2.js assets/drive-v2.css assets/drive-page.js
          git commit -m 'drive: iPhone big-button UI, background batch upload with auto-retry, date-based photo filter'
          git push origin HEAD:main
