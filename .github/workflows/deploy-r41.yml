name: deploy-r41
on:
  push:
    paths:
      - '.deploy-r41/trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: bash .deploy-r41/apply.sh
