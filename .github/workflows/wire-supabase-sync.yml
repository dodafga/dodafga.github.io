name: wire-supabase-sync
on:
  push:
    paths:
      - '.github/workflows/wire-supabase-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Insert supabase-sync script tag
        run: |
          set -euo pipefail
          TAG='<script src="../assets/supabase-sync.js?v=20261127b"></script>'

          add_after() {
            local file="$1" anchor="$2"
            if grep -q 'supabase-sync.js' "$file"; then
              echo "SKIP (already wired): $file"
              return 0
            fi
            if ! grep -q "$anchor" "$file"; then
              echo "ERROR anchor not found in $file: $anchor"
              return 1
            fi
            sed -i "/$(printf '%s' "$anchor" | sed 's/[.[\*^$]/\\&/g')/a\\
          $TAG" "$file"
            echo "WIRED: $file"
          }

          add_after drive/index.html    'cloud-db.js'
          add_after progress/index.html 'cloud-db.js'
          add_after build/index.html    'build-photo-move.js'
          add_after form/index.html     'gdrive-photo.js'
          add_after photo/index.html    'gdrive-photo.js'
          add_after settings/index.html 'gdrive.js'

          echo "--- verify ---"
          for f in drive/index.html progress/index.html build/index.html form/index.html photo/index.html settings/index.html; do
            printf '%-24s ' "$f"
            grep -c 'supabase-sync.js' "$f" || true
          done

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "feat: 六頁掛上 supabase-sync 雲端同步模組"
            git push origin main
          fi

      - name: Self-remove
        run: |
          set -euo pipefail
          git rm -q .github/workflows/wire-supabase-sync.yml
          git commit -m "chore: 移除一次性 wiring workflow"
          git push origin main
