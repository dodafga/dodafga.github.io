name: cleanup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oneoff-orient-field-ratio.yml'
permissions:
  contents: write
jobs:
  rm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover workflow
        run: |
          git rm -f .github/workflows/oneoff-orient-field-ratio.yml || true
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          git commit -m "chore: remove leftover oneoff workflow" || echo none
          git push
