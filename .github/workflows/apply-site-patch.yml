name: apply-site-patch
on:
  push:
    paths:
      - '.github/workflows/apply-site-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download patch
        run: |
          curl -sSL -o /tmp/patch.zip "https://static.teamily.ai/files/ac343aee-bc94-4267-9b88-1020e948ca26/site-patch.zip"
          ls -l /tmp/patch.zip
          unzip -o /tmp/patch.zip -d .
      - name: Verify
        run: |
          md5sum drive/index.html progress/index.html
          grep -c "orient-struct2" drive/index.html
          grep -c "pier-group" progress/index.html
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          git add drive/index.html progress/index.html
          git commit -m "feat: 墩號彙總可折疊收合 + drive 載入欄位結構轉正模組" || echo "nothing to commit"
          git push
      - name: Self delete
        run: |
          git rm -f .github/workflows/apply-site-patch.yml
          git commit -m "chore: remove one-off workflow"
          git push
