name: r60 apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r60.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and place files
        run: |
          set -e
          curl -fsSL https://paste.rs/d0j1i -o build/index.html
          curl -fsSL https://paste.rs/aXlL0 -o assets/assistant.js
          curl -fsSL https://paste.rs/OZqCd -o assets/site.css
          echo "--- sizes ---"
          wc -c build/index.html assets/assistant.js assets/site.css
          echo "--- sha256 ---"
          sha256sum build/index.html assets/assistant.js assets/site.css
          echo "--- sanity ---"
          grep -c 'btnShareText' build/index.html
          grep -c 'sharePhotosThenText' assets/assistant.js
          grep -c 'libDiag' build/index.html || true
          node --check assets/assistant.js && echo "JS OK"
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add build/index.html assets/assistant.js assets/site.css
          git commit -m "營造助手：版面精簡（移除說明文字與診斷區塊）、分享改為照片先送出後附文字說明"
          git push
      - name: Self delete workflow
        run: |
          set -e
          git rm .github/workflows/r60.yml
          git commit -m "chore: remove one-time r60 workflow"
          git push
