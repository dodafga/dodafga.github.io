name: r78-apply
on:
  push:
    paths:
      - '.github/workflows/r78-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch new files
        run: |
          set -e
          B="https://static.teamily.ai/sites/75412899-747e-4617-ad54-32193918a0c6/documents/r78-deploy"
          curl -fsSL "$B/cam.js"           -o assets/cam.js
          curl -fsSL "$B/cam.css"          -o assets/cam.css
          curl -fsSL "$B/drive_index.html" -o drive/index.html
          curl -fsSL "$B/build_index.html" -o build/index.html
      - name: Verify
        run: |
          set -e
          node --check assets/cam.js
          grep -q 'TARGET=4/3' assets/cam.js
          grep -q 'camframe' assets/cam.css
          grep -q 'camframe' drive/index.html
          grep -q 'camframe' build/index.html
          grep -q 'aspect-ratio:4/3' assets/cam.css
          echo "cam.js bytes: $(wc -c < assets/cam.js)"
          echo "cam.css bytes: $(wc -c < assets/cam.css)"
          echo "drive bytes: $(wc -c < drive/index.html)"
          echo "build bytes: $(wc -c < build/index.html)"
          echo VERIFY_OK
      - name: Commit
        run: |
          git config user.name "r78-bot"
          git config user.email "r78-bot@users.noreply.github.com"
          git add assets/cam.js assets/cam.css drive/index.html build/index.html
          git commit -m "fix(cam): 站內相機固定輸出 4:3，修正照片比例被拉伸/壓扁（drive + build）"
          git push
      - name: Self delete
        run: |
          git rm .github/workflows/r78-apply.yml
          git commit -m "chore: remove one-off r78 workflow"
          git push
