name: r69 apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r69-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download new files
        run: |
          set -e
          mkdir -p /tmp/in
          B="https://static.teamily.ai/sites/75412899-747e-4617-ad54-32193918a0c6/documents/r69-deploy"
          TK="tk=c2l0ZTo3NTQxMjg5OS03NDdlLTQ2MTctYWQ1NC0zMjE5MzkxOGEwYzYvZG9jdW1lbnRzL3I2OS1kZXBsb3k6MTc5NTUyODMzOQ.NTU5ZGM3ZWFlNzY0NWE4Y2Q5NjE4YTdlNjc1ZTczNjY"
          for f in drive_index.html drive-v2.js; do
            curl -fsSL -o "/tmp/in/$f" "$B/$f?$TK"
          done
          ls -l /tmp/in

      - name: Verify content markers
        run: |
          set -e
          cd /tmp/in
          wc -c *
          # 小白板區塊必須已移除
          ! grep -q '小白板' drive_index.html
          ! grep -q 'wbList' drive_index.html
          ! grep -q 'renderWb' drive-v2.js
          ! grep -q 'wbList' drive-v2.js
          # 四段流程
          grep -q '照片上傳' drive_index.html
          grep -q '設定歸檔資料' drive_index.html
          grep -q '暫存' drive_index.html
          grep -q '已上傳' drive_index.html
          # 既有功能仍在
          grep -q 'PageZoomLock' drive-v2.js
          grep -q 'zoomlock.js' drive_index.html
          grep -q 'camModal' drive_index.html
          grep -q 'vnotein' drive-v2.js
          echo "markers OK"

      - name: Apply
        run: |
          set -e
          cp /tmp/in/drive_index.html drive/index.html
          cp /tmp/in/drive-v2.js      assets/drive-v2.js
          node --check assets/drive-v2.js
          git config user.name  "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add drive/index.html assets/drive-v2.js
          git commit -m "feat: 移除相片歸檔的「記錄小白板資料」區塊，流程改為 照片上傳→設定歸檔資料→暫存→已上傳"
          git push origin HEAD:main

      - name: Self delete workflow
        if: always()
        run: |
          set -e
          git pull --rebase origin main || true
          git rm -f .github/workflows/r69-apply.yml || true
          git commit -m "chore: remove one-off r69 workflow" || true
          git push origin HEAD:main || true
