name: deploy-r43
on:
  push:
    paths:
      - '.deploy-r43/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and verify
        run: |
          set -e
          curl -fsSL -o /tmp/photo-index.html "https://paste.rs/xEnV9"
          WANT="1ebada9aa27344ae636c3701c092b53d23456ba32cfa8e475dd272a061752eeb"
          GOT=$(sha256sum /tmp/photo-index.html | awk '{print $1}')
          echo "want=$WANT"
          echo "got =$GOT"
          if [ "$WANT" != "$GOT" ]; then echo "SHA MISMATCH"; exit 1; fi
          cp /tmp/photo-index.html photo/index.html
          ls -la photo/index.html
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add photo/index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "photo: 照片地點/拍攝項目依當日查驗樁號自動帶出（同墩合併 PR3-1、2、3、4）、Word 檔名改為 查驗相片表_YYYYMMDD"
          git push origin main
