name: apply-patch
on:
  push:
    paths:
      - '.github/workflows/apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -e
          echo '' | base64 -d | gunzip > /tmp/site.patch
          wc -c /tmp/site.patch
          git apply -p1 --check /tmp/site.patch
          git apply -p1 /tmp/site.patch
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "feat: PNG uploads, archive photo picker, rename to 查驗助手"
          git push
      - name: Self cleanup
        run: |
          set -e
          git rm -q .github/workflows/apply.yml
          git commit -m "chore: remove one-off workflow"
          git push
