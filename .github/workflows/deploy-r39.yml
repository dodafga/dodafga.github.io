name: deploy-r39
on:
  push:
    paths:
      - '.deploy-r39/trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .deploy-r39/apply.sh
      - run: |
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add photo/index.html photo/photobuilder.js
          git commit -m "fix(photo): match template layout exactly; one description per page"
          git push origin HEAD:main
