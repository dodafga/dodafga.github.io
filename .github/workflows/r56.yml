name: r56 recolor
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r56.yml'
permissions:
  contents: write
jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply palette
        run: |
          python3 .github/r56_apply.py
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "canon8741311@gmail.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "查驗助手配色：焦糖棕紅 #976666 + 霧紫灰 #93939B + 鼠尾草綠 #5f7a63"
          git push origin main
      - name: Self delete
        run: |
          git rm -q .github/workflows/r56.yml .github/r56_apply.py
          git commit -m "chore: remove one-time r56 workflow"
          git push origin main
