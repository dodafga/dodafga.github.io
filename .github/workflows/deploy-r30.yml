name: deploy-r30
on:
  push:
    paths:
      - '.deploy-r30/trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .deploy-r30/patch.py
      - name: Verify
        run: |
          set -e
          grep -q '施工單位: </td>' form/index.html
          grep -q 'contractor: "",' form/index.html
          grep -q "承包商：') + DT(FIXED_CONTRACTOR)" form/index.html
          grep -q '監造單位:' form/index.html
          echo "VERIFY OK"
      - name: Commit and push
        run: |
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add form/index.html
          git commit -m "form: 附件頁尾施工單位留空供簽名（監造單位不變）"
          git push origin HEAD:main
