name: apply-v19
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-v19.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          curl -sL -o /tmp/v19.patch "https://static.teamily.ai/files/1bfd78eb-0fb8-4d4b-8512-b8bb184d7284/v19.patch?tk=ZmlsZToxYmZkNzhlYi0wZmI4LTRkNGItODUxMi1iOGJiMTg0ZDcyODQ6MTc5NDM5MjU1OA.OGE4YWM2NjNlYTI4ODFhOGJjYTIzZTU4YWI5NDZlOTY"
          wc -c /tmp/v19.patch
          git apply --verbose /tmp/v19.patch
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "feat(progress): 施作日期單一欄位 + 墩開始/完成時間；舊資料自動轉換"
          git push
      - name: Self-delete workflow
        run: |
          git rm .github/workflows/apply-v19.yml
          git commit -m "chore: remove one-off workflow"
          git push
