name: restore-store-and-progress
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: restore-store
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if already fixed
        id: chk
        run: |
          if grep -q "materialRowsByType" assets/store.js 2>/dev/null && grep -q "materialRowsByType" progress/index.html 2>/dev/null; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "Already fixed - nothing to do."
          else
            echo "already=no" >> $GITHUB_OUTPUT
            echo "Needs fix."
          fi

      - name: Restore store.js base from last good commit
        if: steps.chk.outputs.already == 'no'
        run: |
          git show 5aaa05ce6c:assets/store.js > assets/store.js
          echo "base store.js bytes: $(wc -c < assets/store.js)"

      - name: Apply patches
        if: steps.chk.outputs.already == 'no'
        run: |
          echo '' | base64 -d > /tmp/store.patch
          echo '' | base64 -d > /tmp/prog.patch
          git apply --verbose /tmp/store.patch
          git apply --verbose /tmp/prog.patch

      - name: Verify
        if: steps.chk.outputs.already == 'no'
        run: |
          echo "store.js bytes: $(wc -c < assets/store.js)"
          echo "progress bytes: $(wc -c < progress/index.html)"
          echo "materialRowsByType in store: $(grep -c materialRowsByType assets/store.js)"
          echo "materialRowsByType in progress: $(grep -c materialRowsByType progress/index.html)"
          if grep -q "PLACEHOLDER" assets/store.js; then echo "ERROR: placeholder still present"; exit 1; fi
          node --check assets/store.js && echo "store.js syntax OK"

      - name: Commit fix
        if: steps.chk.outputs.already == 'no'
        run: |
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          git add assets/store.js progress/index.html
          git commit -m "fix: restore assets/store.js (was placeholder) + progress material export split & oldest-first sort"
          git push

      - name: Self-remove workflow
        run: |
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          git pull --rebase || true
          git rm -f .github/workflows/restore-store-and-progress.yml
          git commit -m "chore: remove one-off workflow"
          git push
