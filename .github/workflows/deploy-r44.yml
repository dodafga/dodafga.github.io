name: deploy-r44
on:
  push:
    paths:
      - '.deploy-r44/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and verify
        run: |
          set -e
          curl -fsSL -o /tmp/photo-index.html "https://paste.rs/QecPg"
          WANT="70d6368a095649060bb76fa71b7fe8b02e7ec7428b9f332aa2bf34a97e46e17a"
          GOT=$(sha256sum /tmp/photo-index.html | awk '{print $1}')
          echo "want=$WANT"
          echo "got =$GOT"
          if [ "$WANT" != "$GOT" ]; then echo "SHA MISMATCH"; exit 1; fi
          cp /tmp/photo-index.html photo/index.html
          ls -la photo/index.html
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add photo/index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "photo: 選日期後照片地點/拍攝項目鎖定（唯讀）；新增岸別選單（東岸/西岸/復舊）"
          git push origin main
