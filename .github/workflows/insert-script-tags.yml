name: insert-script-tags
on:
  push:
    paths:
      - '.github/workflows/insert-script-tags.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert script tags
        run: |
          python3 - <<'PY'
          import io, sys

          def patch(path, anchor, add, label):
              s = io.open(path, encoding='utf-8').read()
              if add in s:
                  print(label, 'already present, skip')
                  return False
              n = s.count(anchor)
              if n != 1:
                  print(label, 'ANCHOR COUNT', n, '-> abort')
                  sys.exit(1)
              s = s.replace(anchor, anchor + '\n' + add)
              io.open(path, 'w', encoding='utf-8').write(s)
              print(label, 'patched, bytes =', len(s.encode('utf-8')))
              return True

          a = patch('progress/index.html',
                    '<script src="../assets/gdrive.js"></script>',
                    '<script src="../assets/progress-collapse.js"></script>',
                    'progress')
          b = patch('drive/index.html',
                    '<script src="../assets/orient.js"></script>',
                    '<script src="../assets/orient-struct2.js"></script>',
                    'drive')
          print('changed:', a, b)
          PY
      - name: Verify
        run: |
          grep -c "progress-collapse" progress/index.html
          grep -c "orient-struct2" drive/index.html
          wc -c progress/index.html drive/index.html
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          git add progress/index.html drive/index.html
          git commit -m "feat: 載入墩號彙總折疊模組與欄位結構轉正模組" || echo "nothing to commit"
          git push
      - name: Self delete
        run: |
          git rm -f .github/workflows/insert-script-tags.yml
          git commit -m "chore: remove one-off workflow"
          git push
