name: r66 apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r66-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download new files
        run: |
          set -e
          mkdir -p /tmp/in
          curl -fsSL -o /tmp/in/drive_index.html "https://static.teamily.ai/sites/75412899-747e-4617-ad54-32193918a0c6/documents/r66-deploy/drive_index.html?tk=c2l0ZTo3NTQxMjg5OS03NDdlLTQ2MTctYWQ1NC0zMjE5MzkxOGEwYzYvZG9jdW1lbnRzL3I2Ni1kZXBsb3k6MTc5NTUyMzkyMQ.ZTAzNmU4YzRhNDFmNDQ5MjkxNTAyM2NkNjQ0NTkwMTk"
          curl -fsSL -o /tmp/in/drive-v2.js "https://static.teamily.ai/sites/75412899-747e-4617-ad54-32193918a0c6/documents/r66-deploy/drive-v2.js?tk=c2l0ZTo3NTQxMjg5OS03NDdlLTQ2MTctYWQ1NC0zMjE5MzkxOGEwYzYvZG9jdW1lbnRzL3I2Ni1kZXBsb3k6MTc5NTUyMzkyMQ.ZTAzNmU4YzRhNDFmNDQ5MjkxNTAyM2NkNjQ0NTkwMTk"
          ls -l /tmp/in

      - name: Verify content markers
        run: |
          set -e
          cd /tmp/in
          echo "--- sizes ---"; wc -c drive_index.html drive-v2.js
          echo "--- markers ---"
          grep -c "camZoomRange" drive_index.html
          grep -c "czmin" drive_index.html
          grep -c "CAM_DET" drive-v2.js
          grep -c "camSliderToZoom" drive-v2.js
          grep -c "camDetentIndex" drive-v2.js
          test "$(wc -c < drive_index.html)" -gt 25000
          test "$(wc -c < drive-v2.js)" -gt 40000
          grep -q "camZoomRange" drive_index.html
          grep -q "czmin" drive_index.html
          grep -q "CAM_DET" drive-v2.js
          grep -q "camSliderToZoom" drive-v2.js
          if grep -q 'data-z="1"' drive_index.html; then echo "ERROR: quick zoom buttons still present"; exit 1; fi
          if grep -q 'data-z="5"' drive_index.html; then echo "ERROR: quick zoom buttons still present"; exit 1; fi
          grep -q 'camview{position:absolute;inset:0' drive_index.html
          echo "markers OK"

      - name: Apply
        run: |
          set -e
          cp /tmp/in/drive_index.html drive/index.html
          cp /tmp/in/drive-v2.js assets/drive-v2.js
          node --check assets/drive-v2.js
          git config user.name  "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add drive/index.html assets/drive-v2.js
          git commit -m "feat(drive): 變焦只留單一滑桿、1x-3x 吸附鈍感、相機全螢幕取景"
          git push origin HEAD:main

      - name: Self delete workflow
        if: always()
        run: |
          set -e
          git pull --rebase origin main || true
          git rm -f .github/workflows/r66-apply.yml || true
          git commit -m "chore: remove one-off r66 workflow" || true
          git push origin HEAD:main || true
