name: wmfix
on:
  push:
    paths:
      - '.github/workflows/restore-wm.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -e
          git show 073cd23666f2b7f3c6afe456505a6a125e610c10:assets/drive-v2.js > /tmp/orig.js
          echo "orig size: $(stat -c%s /tmp/orig.js)"
          python3 - <<'PY'
          import io
          orig = open('/tmp/orig.js', encoding='utf-8').read()
          patch = open('.wmfix/patch.js', encoding='utf-8').read()
          start = orig.index('function stampDate(cv,dateISO){')
          end = orig.index('function renderFinal(', start)
          out = orig[:start] + patch + orig[end:]
          open('assets/drive-v2.js','w',encoding='utf-8').write(out)
          print('new size:', len(out.encode('utf-8')))
          assert 'PhotoWatermark.drawWatermark' in out
          assert 'function renderFinal(' in out
          PY
          node -e "new Function(require('fs').readFileSync('assets/drive-v2.js','utf8'));console.log('syntax OK')"
          git config user.name dodafga
          git config user.email 132368659+dodafga@users.noreply.github.com
          git add assets/drive-v2.js
          git commit -m "fix(drive): restore F-24-03 watermark format (orange, right-bottom, 3.5%, dotted date)"
          git push
