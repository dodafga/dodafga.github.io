name: r88 restore drive
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 還原正常的 drive/index.html
        run: git checkout f94e249681d092a238f72f760ea9c9ecac428ca1 -- drive/index.html

      - name: 套用白屏保險
        run: python3 .github/scripts/patch_drive.py

      - name: 提交
        run: |
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          git add drive/index.html
          git commit -m "fix(drive): 還原 drive/index.html 並加白屏保險（camopen 自癒）" || echo "no change"
          git push

      - name: 自我刪除
        run: |
          git rm -q .github/workflows/r88-restore-drive.yml
          git commit -m "chore: 移除一次性 workflow r88" || echo "no change"
          git push
