name: oneoff-audit-fix
on:
  push:
    paths:
      - '.github/workflows/oneoff-audit-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and extract
        run: |
          set -e
          curl -sSL -o /tmp/site.zip "https://static.teamily.ai/sites/37eb832d-9280-41aa-bf49-25ff6910a93a/documents/audit-fix/site.zip?tk=c2l0ZTozN2ViODMyZC05MjgwLTQxYWEtYmY0OS0yNWZmNjkxMGE5M2EvZG9jdW1lbnRzL2F1ZGl0LWZpeDoxNzk0NTE0NjQ1.YzlhMDUxYzA4YWJjNThiZGYyYzkyN2VhNzBhYzgyZGU"
          ls -l /tmp/site.zip
          unzip -o /tmp/site.zip -d .
          echo "--- md5 ---"
          md5sum progress/index.html settings/index.html
          echo "--- sizes ---"
          wc -c progress/index.html settings/index.html
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add progress/index.html settings/index.html
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "fix(progress,settings): 材料區窄螢幕維持並排、材料表改由舊到新、複製 Client ID 剪貼簿失敗不再拋錯"
            git push origin HEAD:main
          fi
      - name: Self delete workflow
        run: |
          set -e
          git pull --rebase origin main || true
          git rm -f .github/workflows/oneoff-audit-fix.yml || true
          git commit -m "chore: remove one-off workflow" || true
          git push origin HEAD:main || true
