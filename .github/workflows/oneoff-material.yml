name: oneoff-material
on:
  push:
    paths:
      - '.github/workflows/oneoff-material.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -e
          echo '' | base64 -d | gunzip > /tmp/all.patch
          git apply --whitespace=nowarn /tmp/all.patch
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "feat(progress): add material control (cement/sand tonnage to m3 vs 6 m3 per pile design)"
          git push
      - name: Self delete
        run: |
          set -e
          git rm -q .github/workflows/oneoff-material.yml
          git commit -m "chore: remove one-off workflow"
          git push
