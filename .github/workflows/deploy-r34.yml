name: deploy-r34
on:
  push:
    paths:
      - '.deploy-r34/trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        run: bash .deploy-r34/apply.sh
      - name: Commit and push
        run: |
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add photo/index.html
          git commit -m "photo: 照片紀錄表每張照片加手動轉向按鍵（左轉/右轉/重設）"
          git push origin HEAD:main
