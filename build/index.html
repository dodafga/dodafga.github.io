<!DOCTYPE html>
<html lang="zh-Hant">
<head><script data-tmly-media-guard="1">(function(){"use strict";
var T=window.__tmly||(window.__tmly=(function(){
var o={},n=String(window.name||"");
if(n.slice(0,5)==="tmly:"){n.slice(5).split("&").forEach(function(kv){
var i=kv.indexOf("=");if(i>0){o[kv.slice(0,i)]=kv.slice(i+1)}})}
return o})());
if(T.presentation!=="preview"){return}
var K="tmly:media-muted:"+String(location.pathname).replace(/[^/]*$/,"");
var muted=false;try{muted=localStorage.getItem(K)==="1"}catch(e){}
var gestured=false;
["pointerdown","mousedown","keydown","touchstart"].forEach(function(t){
document.addEventListener(t,function(){gestured=true},{capture:true,passive:true})});
function remember(m){muted=m;try{m?localStorage.setItem(K,"1"):localStorage.removeItem(K)}catch(e){}}
function announcePaused(el){try{el.dispatchEvent(new Event("pause"))}catch(e){}}
function harden(el){
el.autoplay=false;el.removeAttribute("autoplay");
if(el.getAttribute("preload")==="auto"){el.setAttribute("preload","none")}
if(muted){el.muted=true}
if(!gestured&&!el.paused){try{el.pause()}catch(e){}}}
var play=HTMLMediaElement.prototype.play;
HTMLMediaElement.prototype.play=function(){
if(!gestured){announcePaused(this);
return Promise.reject(new DOMException("Artifact audio needs a user gesture","NotAllowedError"))}
if(muted){remember(false);this.muted=false}
return play.apply(this,arguments)};
var acProtos=[];
function guardAC(n){
var N=window[n];if(!N||!N.prototype){return}
if(acProtos.indexOf(N.prototype)<0){acProtos.push(N.prototype);
var res=N.prototype.resume;
if(typeof res==="function"){N.prototype.resume=function(){
if(!gestured){return Promise.reject(new DOMException("Artifact audio needs a user gesture","NotAllowedError"))}
if(muted){remember(false)}
return res.apply(this,arguments)}}}
var W=function(o){var c=arguments.length?new N(o):new N();
if(!gestured){try{c.suspend()}catch(e){}}return c};
W.prototype=N.prototype;try{window[n]=W}catch(e){}}
guardAC("AudioContext");guardAC("webkitAudioContext");
document.addEventListener("play",function(e){
var el=e.target;if(el instanceof HTMLMediaElement&&!gestured){try{el.pause()}catch(err){}}},true);
document.addEventListener("pause",function(e){
if(e.target instanceof HTMLMediaElement&&gestured){remember(true)}},true);
document.addEventListener("volumechange",function(e){
var el=e.target;if(el instanceof HTMLMediaElement&&gestured){remember(el.muted||el.volume===0)}},true);

for(var i=0;i<l.length;i++){harden(l[i])}}}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7A848D">
<title>營造助手｜施工照片歸檔</title>
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/cam.css">
</head>
<body>

<header>
  <div class="hwrap">
    <div class="logo">造</div>
    <div class="brand">
      <h1>營造助手</h1>
    </div>
    <div class="hactions">
      <a class="iconbtn" href="../settings/index.html" target="_blank" rel="noopener"
         title="設定" aria-label="設定"><span aria-hidden="true">⚙</span></a>
    </div>
  </div>
  <div class="sysbar">
    <div class="sysswitch" role="tablist" aria-label="系統切換">
      <a href="../index.html" role="tab" aria-selected="false">查驗助手</a>
      <a href="index.html" class="on" role="tab" aria-selected="true" aria-current="page">營造助手</a>
    </div>
  </div>
</header>

<div class="tabbar" role="tablist" aria-label="功能">
  <button type="button" class="tab on" data-panel="photo" role="tab" aria-selected="true">
    <span class="ic" aria-hidden="true">📷</span>照片歸檔
  </button>
  <button type="button" class="tab" data-panel="todo" role="tab" aria-selected="false">
    <span class="ic" aria-hidden="true">✅</span>代辦
  </button>
  <button type="button" class="tab" data-panel="event" role="tab" aria-selected="false">
    <span class="ic" aria-hidden="true">📅</span>日期事項
  </button>
</div>

<main>

  <!-- ============ 1. 施工照片歸檔 ============ -->
  <section class="panel on" id="p-photo" role="tabpanel" aria-label="施工照片歸檔">

    <div class="card">
      <div class="cardhd">
        <h2>歸檔資料</h2>
        <span class="hintx" id="connTxt">尚未連線</span>
        <span class="dot" id="connDot" style="margin-left:0"></span>
      </div>
      <div class="grid2">
        <label class="fld">
          <span>日期</span>
          <input type="date" id="fDate">
        </label>
        <label class="fld">
          <span>工項</span>
          <input type="text" id="fItem" placeholder="例：預壘樁查驗" autocomplete="off">
        </label>
      </div>
      <label class="fld" style="margin-top:10px">
        <span>廠商名稱</span>
        <input type="text" id="fVendor" placeholder="例：義力營造" autocomplete="off">
      </label>

      <div class="crewblock">
        <div class="crewhead">
          <span class="crewt">常用廠商</span>
        </div>
        <div class="presetrow">
          <input type="text" id="vendorPresetName" maxlength="30" placeholder="廠商名稱，例：義力營造" autocomplete="off">
          <button type="button" class="btn sm" id="btnVendorSave">儲存</button>
        </div>
        <div class="presetlist" id="vendorList"></div>
      </div>

      <div class="crewblock">
        <div class="crewhead">
          <span class="crewt">工種</span>
          <button type="button" class="btn ghost sm" id="btnAddType">＋ 新增</button>
        </div>
        <div class="crewrows" id="typeRows"></div>
      </div>

      <div class="crewblock">
        <div class="crewhead">
          <span class="crewt">機具</span>
          <button type="button" class="btn ghost sm" id="btnAddMach">＋ 新增</button>
        </div>
        <div class="crewrows" id="machRows"></div>
      </div>

      <div class="crewblock">
        <div class="crewhead">
          <span class="crewt">常用班組</span>
        </div>
        <div class="presetrow">
          <input type="text" id="presetName" maxlength="20" placeholder="班組名稱，例：鋼筋班" autocomplete="off">
          <button type="button" class="btn sm" id="btnPresetSave">儲存</button>
        </div>
        <div class="presetlist" id="presetList"></div>
      </div>

      <div class="rowline">
        <label class="chk">
          <input type="checkbox" id="chkWm" checked>
          壓上日期浮水印
        </label>
        <button type="button" class="btn ghost sm" id="connBtn" style="margin-left:auto">🔗 連線 Drive</button>
      </div>
    </div>

    <div class="card">
      <div class="cardhd">
        <h2>加入照片</h2>
      </div>
      <div class="addrow">
        <button type="button" class="addbtn" id="btnCam">
          <span class="big" aria-hidden="true">📷</span>
          <span>拍照</span>
          <span class="sm2">開手機相機，可連拍多張</span>
        </button>
        <label class="addbtn" for="filePick">
          <span class="big" aria-hidden="true">🖼</span>
          <span>本機上傳</span>
          <span class="sm2">從相簿選，可多選</span>
        </label>
      </div>
      <input type="file" id="filePick" accept="image/*" multiple hidden>
      <input type="file" id="camInput" accept="image/*" capture="environment" hidden>

      <div class="pendbox" id="pendBox" style="display:none">
        <div class="pendhd">
          <b>待加入 <span id="pendCount">0</span> 張</b>
          <button type="button" class="btn ghost sm" id="btnPendClear" style="margin-left:auto">清除</button>
        </div>
        <div class="pendgrid" id="pendGrid"></div>
        <button type="button" class="btn wide" id="btnPendAdd" style="margin-top:10px">加入暫存區（0）</button>
      </div>
    </div>

    <div class="card">
      <div class="cardhd">
        <h2>暫存區 <span class="cnt" id="pCount">0</span></h2>
        <button type="button" class="ibtn trash" id="btnClear" disabled title="清空" aria-label="清空">🗑</button>
      </div>
      <div class="pgrid" id="pgrid"></div>
      <div class="empty" id="pEmpty">尚無照片</div>
      <div class="prog" id="pProg"></div>
      <label class="chk" style="margin-top:12px">
        <input type="checkbox" id="chkShareText">
        照片送出後附上文字說明
      </label>
      <div class="hintx" id="shareTextPreview" style="margin:2px 0 0;display:none"></div>
      <div class="btnrow" style="margin-top:12px">
        <button type="button" class="btn ibtn" id="btnUpload" disabled title="上傳至 Google Drive" aria-label="上傳至 Google Drive"><span class="ic">☁</span><span class="cnt" id="upCount">0</span></button>
        <button type="button" class="btn ghost ibtn" id="btnDownload" disabled title="下載到本機" aria-label="下載到本機"><span class="ic">⬇</span></button>
        <button type="button" class="btn ibtn line" id="btnStageLine" disabled title="分享暫存區照片到 LINE" aria-label="分享暫存區照片到 LINE"><svg class="lineic" viewBox="0 0 34 20" aria-hidden="true"><rect x="0" y="0" width="34" height="20" rx="6" fill="#fff"/><text class="lineic2" x="17" y="14" text-anchor="middle">LINE</text></svg></button>
      </div>
      <button type="button" class="btn ghost wide" id="btnShareText" style="display:none;margin-top:8px">附上文字說明</button>
    </div>

    <div class="card">
      <div class="cardhd">
        <h2>已上傳</h2>
        <span class="hintx" id="libSum"></span>
      </div>
      <div class="grid2">
        <label class="fld">
          <span>日期</span>
          <input type="date" id="libDate">
        </label>
        <label class="fld">
          <span>工項</span>
          <select id="libItem"><option value="">全部</option></select>
        </label>
      </div>
      <div class="btnrow" style="margin-top:10px">
        <button type="button" class="btn wide" id="btnLibLoad">↻ 讀取這一天</button>
      </div>

      <div class="libbar" id="libBar" style="display:none">
        <span class="libsel" id="libSel">已選 0 張</span>
        <span style="margin-left:auto"></span>
        <button type="button" class="btn ghost sm" id="btnLibAll">全選</button>
        <button type="button" class="btn ghost sm" id="btnLibNone">取消</button>
        <button type="button" class="btn sm ibtn line" id="btnLibLine" title="分享 PNG 到 LINE" aria-label="分享 PNG 到 LINE"><svg class="lineic" viewBox="0 0 34 20" aria-hidden="true"><rect x="0" y="0" width="34" height="20" rx="6" fill="#fff"/><text class="lineic2" x="17" y="14" text-anchor="middle">LINE</text></svg></button>
        <button type="button" class="btn ghost sm" id="btnLibDl">⬇</button>
        <button type="button" class="btn ghost sm" id="btnLibCopy">連結</button>
      </div>

      <div class="hintx" id="libShareMode" style="margin:0 0 8px;font-weight:700;color:#4A5056"></div>

      <div class="libgrid" id="libGrid"></div>
      <div class="empty" id="libEmpty">尚未讀取</div>
    </div>

  </section>

  <!-- ============ 2. 代辦事項 ============ -->
  <section class="panel" id="p-todo" role="tabpanel" aria-label="代辦事項">

    <div class="odbox" id="odBox" style="display:none">
      <div class="odhd"><span aria-hidden="true">⚠</span> 逾期未完成 <span class="odn" id="odCount"></span></div>
      <ul class="odlist" id="odList"></ul>
    </div>

    <div class="card">
      <div class="cardhd"><h2>新增代辦</h2></div>
      <label class="fld">
        <span>內容</span>
        <input type="text" id="tTitle" placeholder="例：PR4-1 樁位複測" autocomplete="off">
      </label>
      <div class="grid2" style="margin-top:10px">
        <label class="fld">
          <span>類型</span>
          <select id="tType">
            <option value="due">期限（單次）</option>
            <option value="repeat">重複性任務</option>
          </select>
        </label>
        <label class="fld" id="tDueWrap">
          <span>期限</span>
          <input type="date" id="tDue">
        </label>
        <label class="fld" id="tRepeatWrap" style="display:none">
          <span>頻率</span>
          <select id="tRepeat">
            <option value="daily">每天</option>
            <option value="weekly" selected>每週</option>
            <option value="monthly">每月</option>
            <option value="workday">每工作日</option>
          </select>
        </label>
      </div>
      <div class="btnrow" style="margin-top:12px">
        <button type="button" class="btn wide" id="btnAddTodo">＋ 新增</button>
      </div>
    </div>

    <div class="card">
      <div class="cardhd">
        <h2>代辦清單</h2>
        <span class="hintx" id="todoSum"></span>
      </div>
      <ul class="list" id="todoList"></ul>
      <div class="empty" id="todoEmpty">尚無代辦</div>
    </div>

  </section>

  <!-- ============ 3. 日期事項 ============ -->
  <section class="panel" id="p-event" role="tabpanel" aria-label="日期事項">

    <div class="card">
      <div class="cardhd"><h2>新增事項</h2></div>
      <div class="grid2">
        <label class="fld">
          <span>日期</span>
          <input type="date" id="eDate">
        </label>
        <label class="fld">
          <span>事項</span>
          <input type="text" id="eTitle" placeholder="例：監造查驗" autocomplete="off">
        </label>
      </div>
      <label class="fld" style="margin-top:10px">
        <span>備註</span>
        <textarea id="eNote" placeholder="例：上午 9:00 現場集合"></textarea>
      </label>
      <div class="btnrow" style="margin-top:12px">
        <button type="button" class="btn wide" id="btnAddEvent">＋ 新增</button>
      </div>
    </div>

    <div class="card">
      <div class="cardhd">
        <h2>日期事項</h2>
        <span class="hintx" id="evSum"></span>
      </div>
      <div id="evList" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="empty" id="evEmpty">尚無事項</div>
    </div>

  </section>

</main>

<!-- ===== 站內相機：全螢幕取景、可連拍多張 ===== -->
<div class="camwrap" id="camModal" role="dialog" aria-modal="true" aria-label="拍照">
  <div class="camview" id="camView">
    <video id="camVideo" playsinline autoplay muted></video>
    <div class="camgrid" id="camGrid" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="camflash" id="camFlash"></div>
    <div class="camtop">
      <span class="camcnt" id="camModalCount">0 張</span>
      <button type="button" class="camx" id="camClose" aria-label="關閉">✕</button>
    </div>
    <div class="camzoom" id="camZoom">
      <span class="czmin" aria-hidden="true">1×</span>
      <input type="range" id="camZoomRange" min="0" max="1000" step="1" value="0" aria-label="變焦倍率">
      <span class="czmax" aria-hidden="true">5×</span>
      <span class="czv" id="camZoomVal">1.0×</span>
    </div>
    <div class="camerr" id="camErr" hidden></div>
  </div>
  <div class="cambar">
    <button type="button" class="camthumb" id="camThumb" hidden aria-label="檢視剛拍的照片">
      <img id="camThumbImg" alt="">
    </button>
    <button type="button" class="shutter" id="camShutter" aria-label="拍一張"><span></span></button>
    <button type="button" class="camuse" id="camUse2" disabled>使用照片（0）</button>
  </div>
<div class="camviewer" id="camViewer" role="dialog" aria-modal="true" aria-label="檢視照片">
  <div class="cvhd">
    <b>剛拍的照片</b>
    <span class="cvcnt" id="cvCount">0 / 0</span>
    <button type="button" class="cvx" id="cvClose" aria-label="關閉">✕</button>
  </div>
  <div class="cvbody"><img id="cvImg" alt=""></div>
  <div class="cvft">
    <button type="button" id="cvPrev">‹ 上一張</button>
    <button type="button" class="del" id="cvDel">刪除這張</button>
    <button type="button" id="cvNext">下一張 ›</button>
  </div>
</div>
</div>
<!-- 剛拍照片檤視器 -->


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/core.js"></script>
<script src="../assets/gdrive.js"></script>
<script src="../assets/watermark.js"></script>
<script src="../assets/gdrive-photo.js"></script>
<script src="../assets/cam.js"></script>
<script src="../assets/assistant.js"></script>
</body>
</html>
