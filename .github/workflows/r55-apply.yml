name: r55 apply
on:
  push:
    paths:
      - '.github/workflows/r55-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download files
        run: |
          set -e
          curl -fsSL -o build/index.html "https://paste.rs/QN6Hi"
          curl -fsSL -o assets/site.css "https://paste.rs/GWv88"
          curl -fsSL -o assets/assistant.js "https://paste.rs/OCGxI"
          echo "--- sizes ---"
          wc -c build/index.html assets/site.css assets/assistant.js
          echo "--- sha ---"
          sha256sum build/index.html assets/site.css assets/assistant.js
          echo "--- sanity ---"
          grep -c "暫存區" build/index.html
          grep -c "btnStageLine" assets/assistant.js
          node --check assets/assistant.js
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add build/index.html assets/site.css assets/assistant.js
          git commit -m "版面重整：莫蘭迪配色、手機優先、暫存區（分享前先載入）" || echo "no changes"
          git push origin main
      - name: Self delete
        run: |
          git rm -f .github/workflows/r55-apply.yml
          git commit -m "chore: remove one-time workflow"
          git push origin main
