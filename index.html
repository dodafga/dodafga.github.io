<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查驗表單產生器｜查驗單 · 查驗相片表 · 查驗紀錄表 · 預壘樁進度</title>
<style>
  :root{
    --ink:#1b2430; --ink-2:#3d4a5c; --muted:#6b7a8d;
    --line:#d8dee7; --line-2:#e8edf3; --bg:#eef1f5; --card:#fff;
    --steel:#1f3a5f; --steel-2:#2c5282;
    --amber:#c47f17; --amber-bg:#fdf6e7;
    --ok:#1f7a4d; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    font-size:15px;line-height:1.6;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  header{background:var(--steel);color:#fff;padding:13px 22px;border-bottom:3px solid var(--amber);
    flex:0 0 auto;z-index:10;}
  .hwrap{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .logo{width:40px;height:40px;flex:0 0 40px;border-radius:9px;background:var(--amber);color:#1b2430;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px;}
  .brand .sub{font-size:12px;color:#b9c8da;margin-top:2px;transition:opacity .2s;}
  .switcher{margin-left:auto;display:flex;gap:6px;background:rgba(255,255,255,.10);
    padding:5px;border-radius:12px;border:1px solid rgba(255,255,255,.14);}
  .switcher button{
    font-family:inherit;font-size:14px;font-weight:700;color:#cdd9e8;background:transparent;
    border:none;border-radius:8px;padding:9px 20px;cursor:pointer;transition:.18s;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .switcher button .ic{font-size:16px;line-height:1;}
  .switcher button:hover{color:#fff;background:rgba(255,255,255,.10);}
  .switcher button.on{background:#fff;color:var(--steel);box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .switcher .setlink{font-family:inherit;font-size:13px;font-weight:700;color:#cdd9e8;
    text-decoration:none;border-radius:8px;padding:9px 14px;display:inline-flex;
    align-items:center;gap:6px;white-space:nowrap;transition:.18s;
    border-left:1px solid rgba(255,255,255,.18);margin-left:2px;}
  .switcher .setlink:hover{color:#fff;background:rgba(255,255,255,.10);}

  .stage{flex:1 1 auto;position:relative;min-height:0;background:var(--bg);}
  .frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg);}
  .frame.on{display:block;}

  .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    color:var(--muted);font-size:14px;}

  @media (max-width:720px){
    header{padding:11px 14px;}
    .brand h1{font-size:15.5px;}
    .brand .sub{display:none;}
    .switcher{margin-left:0;width:100%;}
    .switcher button{flex:1;justify-content:center;padding:9px 6px;font-size:12px;}
    .switcher button .ic{display:none;}
  }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">驗</div>
    <div class="brand">
      <h1>查驗表單產生器</h1>
      <div class="sub" id="sub">工程查驗文件線上填寫 · 即時預覽 · 一鍵下載 .docx</div>
    </div>
    <div class="switcher" role="tablist" aria-label="表單類型">
      <button id="btnForm" class="on" type="button" role="tab" aria-selected="true">
        <span class="ic">📋</span>查驗單</button>
      <button id="btnPhoto" type="button" role="tab" aria-selected="false">
        <span class="ic">📷</span>查驗相片表</button>
      <button id="btnLog" type="button" role="tab" aria-selected="false">
        <span class="ic">📊</span>查驗紀錄表</button>
      <button id="btnProgress" type="button" role="tab" aria-selected="false">
        <span class="ic">🏗️</span>預壘樁進度</button>
      <button id="btnDrive" type="button" role="tab" aria-selected="false">
        <span class="ic">☁</span>相片上傳歸檔</button>
      <a id="btnSettings" class="setlink" href="settings/index.html" target="_blank" rel="noopener" title="Google Drive 設定">
        <span class="ic">⚙</span>設定</a>
    </div>
  </div>
</header>

<div class="stage" id="stage">
  <div class="hint" id="hint">載入中…</div>
</div>

<script>
(function(){
  "use strict";
  var MODES = {
    form:  { src:"form/index.html",  sub:"工程施工中請驗單 · 版面沿用 F-24-03 範本 · 附件共用欄位 · Google Drive 備份 · A4 直式" },
    photo: { src:"photo/index.html", sub:"工程照片記錄表 · 每頁 3 張 · 照片尺寸與範本一致 · A4 直式" },
    log:   { src:"log/index.html",   sub:"查驗紀錄表 · 樁號可多選 · 樁號依墩分組跨墩勾選 · 整墩全選 · 位置標籤 · 本機自動保存 · A4 橫式 · 下載 .xlsx" },
    progress: { src:"progress/index.html", sub:"預壘樁進度管控表 · 進度以查驗日期為基準 · 墩號彙總（墩開始／整墩結束） · 排序：實際施作／查驗日期／墩號" },
    drive:  { src:"drive/index.html",  sub:"相片上傳歸檔 · 選取或拍攝 → 上傳 Google Drive · 依日期資料夾（YYYY-MM-DD）歸檔 · 批次上傳與重試" }
  };
  var frames = {};
  var stage = document.getElementById("stage");
  var hint = document.getElementById("hint");
  var sub = document.getElementById("sub");
  var btnForm = document.getElementById("btnForm");
  var btnPhoto = document.getElementById("btnPhoto");
  var btnLog = document.getElementById("btnLog");
  var btnProgress = document.getElementById("btnProgress");
  var btnDrive = document.getElementById("btnDrive");
  var current = null;
  var TITLES = { form:"查驗單", photo:"查驗相片表", log:"查驗紀錄表", progress:"預壘樁進度管控表", drive:"相片上傳歸檔" };

  function ensureFrame(key){
    if(frames[key]) return frames[key];
    var f = document.createElement("iframe");
    f.className = "frame";
    f.setAttribute("title", TITLES[key] || key);
    f.src = MODES[key].src;
    f.addEventListener("load", function(){
      /* 同源：隱藏子頁自己的 header，讓外殼成為唯一標題列。
         只動 header 顯示，完全不影響欄位、版面、即時預覽與 Word 輸出。 */
      try{
        var d = f.contentDocument;
        if(d && d.head){
          var s = d.createElement("style");
          s.textContent = "header{display:none !important;}";
          d.head.appendChild(s);
        }
      }catch(e){}
    });
    stage.appendChild(f);
    frames[key] = f;
    return f;
  }

  function show(key){
    if(current === key) return;
    var prev = current;
    current = key;
    ensureFrame(key);
    Object.keys(frames).forEach(function(k){
      frames[k].classList.toggle("on", k === key);
    });
    /* 進度表與紀錄表共用 localStorage：切回時重讀，確保聯動即時反映 */
    if(prev && (key === "progress" || key === "log")){
      try{ frames[key].contentWindow.location.reload(); }catch(e){}
    }
    if(hint) hint.style.display = "none";
    sub.textContent = MODES[key].sub;
    btnForm.classList.toggle("on", key === "form");
    btnPhoto.classList.toggle("on", key === "photo");
    btnLog.classList.toggle("on", key === "log");
    btnProgress.classList.toggle("on", key === "progress");
    btnDrive.classList.toggle("on", key === "drive");
    btnForm.setAttribute("aria-selected", key === "form" ? "true" : "false");
    btnPhoto.setAttribute("aria-selected", key === "photo" ? "true" : "false");
    btnLog.setAttribute("aria-selected", key === "log" ? "true" : "false");
    btnProgress.setAttribute("aria-selected", key === "progress" ? "true" : "false");
    btnDrive.setAttribute("aria-selected", key === "drive" ? "true" : "false");
    try{ history.replaceState(null, "", "#" + key); }catch(e){}
  }

  btnForm.addEventListener("click", function(){ show("form"); });
  btnPhoto.addEventListener("click", function(){ show("photo"); });
  btnLog.addEventListener("click", function(){ show("log"); });
  btnProgress.addEventListener("click", function(){ show("progress"); });
  btnDrive.addEventListener("click", function(){ show("drive"); });

  var initial = (location.hash || "").replace("#","");
  show(MODES[initial] ? initial : "form");
})();
</script>
</body>
</html>
