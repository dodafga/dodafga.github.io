name: restore-drive-v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: restore and patch
        run: |
          git show c9a76a31902998820035bce9f067d4c1079459d8:assets/drive-v2.js > assets/drive-v2.js
          python3 -c "import base64,io;io.open('/tmp/p.py','wb').write(base64.b64decode(''))"
          python3 /tmp/p.py
          node --check assets/drive-v2.js
          wc -c assets/drive-v2.js
          sha256sum assets/drive-v2.js
          grep -c allStations assets/drive-v2.js
      - name: commit
        run: |
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          git add assets/drive-v2.js
          git diff --cached --quiet && echo "no change" || git commit -m "fix(drive): restore drive-v2.js and keep full station list when no date"
          git push
