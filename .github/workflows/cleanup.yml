name: cleanup
on:
  push:
    paths:
      - '.github/workflows/cleanup.yml'
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name dodafga
          git config user.email 132368659+dodafga@users.noreply.github.com
          git rm -r --ignore-unmatch .wmfix .github/workflows/restore-wm.yml .github/workflows/cleanup.yml
          git commit -m "chore: remove one-off watermark fix scaffolding" || true
          git push
