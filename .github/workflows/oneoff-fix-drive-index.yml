name: oneoff-fix-drive-index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oneoff-fix-drive-index.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and patch drive/index.html
        run: |
          set -e
          curl -fsSL -o /tmp/base.html "https://raw.githubusercontent.com/dodafga/dodafga.github.io/1ec8e476b033d083756d5a9592783299204c211a/drive/index.html"
          grep -v 'batch-del.js' /tmp/base.html > drive/index.html
          sed -i 's|<script src="../assets/drive-page.js"></script>|<script src="../assets/drive-page.js"></script>\n<script src="../assets/batch-del.js"></script>|' drive/index.html
          echo "--- checks ---"
          wc -c drive/index.html
          echo "batch-del: $(grep -c 'batch-del' drive/index.html)"
          echo "drive-page: $(grep -c 'drive-page.js' drive/index.html)"
          python3 -c "s=open('drive/index.html',encoding='utf-8').read(); assert '\u56de\u67e5\u9a57\u52a9\u624b' in s, 'A'; assert '\u95dc\u9589\u904e\u700f\u89bd\u5668\u5f8c' in s, 'B'; assert '\u8a2d\u5b9a' in s, 'C'; assert '\u8cc7\u6599\u593e\u6b78\u6a94' in s, 'D'; print('text OK')"
          git config user.name dodafga
          git config user.email dodafga@users.noreply.github.com
          git add drive/index.html
          git commit -m "fix(drive): restore index.html text and load batch-del.js" || true
          git push
      - name: Self delete
        if: always()
        run: |
          git pull --rebase || true
          git rm -f .github/workflows/oneoff-fix-drive-index.yml || true
          git commit -m "chore: remove one-off workflow" || true
          git push || true
