name: deploy-ocr-offline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-ocr-offline.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OCR assets into repo
        run: |
          set -e
          mkdir -p assets/ocr/lang
          # 部署時從公開 npm CDN 取檔（僅部署階段使用；網站執行時完全走本站相對路徑）
          curl -fsSL --retry 3 -o assets/ocr/tesseract.min.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"
          curl -fsSL --retry 3 -o assets/ocr/worker.min.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js"
          curl -fsSL --retry 3 -o assets/ocr/tesseract-core-simd-lstm.wasm.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-simd-lstm.wasm.js"
          curl -fsSL --retry 3 -o assets/ocr/tesseract-core-lstm.wasm.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-lstm.wasm.js"
          curl -fsSL --retry 3 -o assets/ocr/lang/chi_tra.traineddata.gz \
            "https://tessdata.projectnaptha.com/4.0.0_fast/chi_tra.traineddata.gz"
          echo "--- sizes ---"
          ls -l assets/ocr assets/ocr/lang
          echo "--- sanity ---"
          test -s assets/ocr/tesseract.min.js
          test -s assets/ocr/worker.min.js
          test -s assets/ocr/tesseract-core-simd-lstm.wasm.js
          test -s assets/ocr/tesseract-core-lstm.wasm.js
          gzip -t assets/ocr/lang/chi_tra.traineddata.gz
          head -c 40 assets/ocr/tesseract.min.js
          echo
          echo "ALL OK"
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          git add -A
          git commit -m "feat(drive): 加入本地 OCR 資產（tesseract + chi_tra 模型）" || echo "nothing to commit"
          git push
      - name: Self-remove workflow
        run: |
          git rm -f .github/workflows/deploy-ocr-offline.yml
          git commit -m "chore: remove one-off deploy workflow"
          git push
