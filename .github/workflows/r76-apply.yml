name: apply-r76

on:
  push:
    paths:
      - '.github/workflows/r76-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: apply patch
        run: python3 deploy/apply_r76.py

      - name: verify
        run: |
          grep -c "cloud-db.js" progress/index.html drive/index.html
          grep -c "資料進度頁" progress/index.html index.html
          node --check assets/cloud-db.js

      - name: commit
        run: |
          git config user.name canon
          git config user.email canon8741311@gmail.com
          git add -A
          git commit -m "資料進度頁：整合存放與雲端；相片歸檔只留暫存與臨時修改"
          git push

      - name: cleanup
        if: always()
        run: |
          git rm -q .github/workflows/r76-apply.yml || true
          git commit -m "chore: remove one-off workflow" || true
          git push || true
