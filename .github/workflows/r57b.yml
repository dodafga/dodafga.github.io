name: r57b relock reset
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r57b.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply
        run: |
          echo '' | base64 -d | gunzip > /tmp/r57b.py
          python3 /tmp/r57b.py
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "canon8741311@gmail.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "查驗單：重新固定欄位時還原為固定預設值"
          git push origin main
      - name: Self delete
        run: |
          git rm -q .github/workflows/r57b.yml
          git commit -m "chore: remove one-time r57b workflow"
          git push origin main
