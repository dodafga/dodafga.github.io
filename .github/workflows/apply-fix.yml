name: apply-fix
on:
  push:
    paths:
      - '.github/workflows/apply-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          set -e
          git apply --verbose fix.patch
          git apply --verbose fix2.patch
          node --check assets/watermark.js
          node --check form/formbuilder.js
          git config user.name 'dodafga'
          git config user.email 'dodafga@users.noreply.github.com'
          git add assets/watermark.js form/formbuilder.js
          git commit -m 'fix: F-24-03 查驗單逐段對齊範本 + 浮水印比例依範本量測校正'
          git push
      - name: Cleanup
        run: |
          git rm -q fix.patch fix2.patch .github/workflows/apply-fix.yml
          git commit -m 'chore: remove one-off patch and workflow'
          git push
