name: fix-r48-folders
on:
  push:
    paths:
      - '.github/workflows/fix-r48-folders.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore correct files and apply folder rename
        run: |
          set -e
          git checkout 8430b9e -- assets/drive-v2.js drive/index.html
          python3 - <<'PY'
          import io
          p = 'assets/drive-v2.js'
          s = io.open(p, encoding='utf-8').read()
          old = 'return G.ensureNamedFolder("營建相片").then(function(rootId){'
          new = 'return G.ensureNamedFolder("義力").then(function(parentId){return G.ensureNamedFolder("查驗照片",parentId).then(function(rootId){'
          assert old in s, 'A not found'
          s = s.replace(old, new, 1)
          old2 = '        return {rootId:rootId,dayId:dayId,stationId:stId};\n      });\n    });\n  });\n}'
          new2 = '        return {parentId:parentId,rootId:rootId,dayId:dayId,stationId:stId};\n      });\n    });\n  });\n  });\n}'
          assert old2 in s, 'B not found'
          s = s.replace(old2, new2, 1)
          s = s.replace('"將上傳到 營建相片 / "', '"將上傳到 義力 / 查驗照片 / "')
          s = s.replace('"已上傳 "+job.done+" 張到 營建相片 / "', '"已上傳 "+job.done+" 張到 義力 / 查驗照片 / "')
          assert '營建相片' not in s, 'C leftover'
          io.open(p, 'w', encoding='utf-8').write(s)
          q = 'drive/index.html'
          h = io.open(q, encoding='utf-8').read()
          h = h.replace('上傳到 營建相片／日期／樁號', '上傳到 義力／查驗照片／日期／樁號')
          h = h.replace('根資料夾 <b>營建相片</b> ／ 子資料夾', '根資料夾 <b>義力</b> ／ <b>查驗照片</b> ／ 子資料夾')
          h = h.replace('資料夾規則：<code>營建相片 / 日期 / 樁號 /</code>', '資料夾規則：<code>義力 / 查驗照片 / 日期 / 樁號 /</code>')
          assert '營建相片' not in h, 'D leftover'
          io.open(q, 'w', encoding='utf-8').write(h)
          print('RENAME_OK')
          PY
          git config user.email "agent@teamily.ai"
          git config user.name "Teamily Agent"
          git add -A
          git commit -m "fix: 還原 drive-v2.js 與 drive/index.html，並改為 義力/查驗照片"
          git push
      - name: Self-delete this one-time workflow
        run: |
          set -e
          git rm .github/workflows/fix-r48-folders.yml
          git commit -m "chore: remove one-time workflow"
          git push
