name: unpack-drive-ocr
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unpack-drive-ocr.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack payloads
        run: |
          set -e
          unpack() {
            src="$1"; dst="$2"; want="$3"
            base64 -d "$src" | gunzip > "$dst"
            got=$(sha256sum "$dst" | cut -c1-16)
            echo "$dst  $(wc -c < "$dst") bytes  sha=$got"
            if [ "$got" != "$want" ]; then echo "SHA MISMATCH for $dst (want $want)"; exit 1; fi
          }
          unpack _tmp/orient-ocr.js.b64      assets/orient-ocr.js   b3c72b323c5b4ebf
          unpack _tmp/drive-v2.js.b64        assets/drive-v2.js     314a1ca365052f1d
          unpack _tmp/drive_index.html.b64   drive/index.html       4988a14f577f95fb
          echo "--- syntax check ---"
          node --check assets/orient-ocr.js
          node --check assets/drive-v2.js
          node --check sw-ocr.js
          echo "ALL OK"
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          git rm -rf _tmp
          git add -A
          git commit -m "feat(drive): OCR 本地化 + 離線快取（assets/ocr + sw-ocr.js + 進度條）"
          git push
      - name: Self-remove workflow
        run: |
          git rm -f .github/workflows/unpack-drive-ocr.yml
          git commit -m "chore: remove one-off unpack workflow"
          git push
