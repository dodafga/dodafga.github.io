name: r71d-apply
on:
  push:
    paths:
      - '.github/workflows/r71d-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and place files
        run: |
          set -e
          mkdir -p drive progress form build assets
          fetch() { curl -fsSL --retry 5 --retry-delay 3 -o "$2" "$1"; echo "  $2 $(wc -c < "$2")"; }
          fetch "https://paste.rs/FiDaJ" index.html
          fetch "https://paste.rs/tVvjv" drive/index.html
          fetch "https://paste.rs/3nqKC" progress/index.html
          fetch "https://paste.rs/9drrf" build/index.html
          fetch "https://paste.rs/crT2L" assets/pile-measure.js
          fetch "https://paste.rs/pGPmA" assets/daily-flow.js
          fetch "https://paste.rs/TywiT" assets/drive-v2.js
          fetch "https://paste.rs/nF8Yb" assets/assistant.js
          fetch "https://paste.rs/vy7HV" assets/site.css
          fetch "https://paste.rs/S9Z1M" assets/cam.css
          fetch "https://paste.rs/08eax" /tmp/form_mobile.css
      - name: Patch form mobile css
        run: |
          set -e
          python3 - <<'PYEOF'
          css = open('/tmp/form_mobile.css', encoding='utf-8').read()
          p = 'form/index.html'
          s = open(p, encoding='utf-8').read()
          if '手機優先版面（form/）' in s:
              print('already patched')
          else:
              i = s.find('</style>')
              assert i > 0, 'no </style>'
              s = s[:i] + css + '\n' + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
              print('patched form/index.html')
          PYEOF
      - name: Verify content markers
        run: |
          set -e
          chk() { grep -q "$2" "$1" || { echo "MISSING in $1: $2"; exit 1; }; echo "  ok $1"; }
          chk index.html 'data-mode="progress"'
          chk drive/index.html 'dailyMount'
          chk drive/index.html 'pmMount'
          chk drive/index.html 'recMount'
          chk drive/index.html 'pile-measure.js'
          chk drive/index.html 'daily-flow.js'
          chk progress/index.html 'pmqMount'
          chk progress/index.html 'pile-measure.js'
          chk form/index.html '手機優先版面'
          chk build/index.html 'comboList'
          chk build/index.html 'comboEmpty'
          chk assets/pile-measure.js 'PileMeasure'
          chk assets/daily-flow.js 'DailyFlow'
          chk assets/drive-v2.js 'stationsForDate'
          chk assets/assistant.js 'build-assistant-combos-v1'
          chk assets/assistant.js '__buildAutoConnect'
          chk assets/cam.css 'camwrap:not(.on)'
          chk assets/site.css 'crewhint'
          echo "ALL MARKERS OK"
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "查驗助手三頁聯動：今日查驗人員固定、逐樁紀錄、完成寫入紀錄表；樁位資料表移至相片歸檔、樁位資料查詢移至進度；移除紀錄表頁；手機優先版面；營造助手自動連線與常用項目" || echo "nothing to commit"
          git push origin HEAD:main
      - name: Self delete
        run: |
          git rm -f .github/workflows/r71d-apply.yml .github/workflows/r71c-apply.yml .github/workflows/r71b-apply.yml .github/workflows/r71-apply.yml || true
          git commit -m "chore: remove one-time workflow" || true
          git push origin HEAD:main || true
