name: apply-r51-share
on:
  push:
    paths:
      - '.github/workflows/apply-r51-share.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          python3 - <<'PYEOF'
          import io
          p='assets/assistant.js'
          s=io.open(p,encoding='utf-8').read()
          start='C.on($("btnLibLine"),"click",function(){'
          i=s.find(start)
          j=s.find(',C.on($("btnLibDl")',i)
          assert i>0 and j>i,(i,j)
          new=r'''var libBlobCache={},libPrefetching={};
          function libFileOf(rec,blob){var nm=rec.name||("photo_"+rec.id+".png");/\.(png|jpe?g|webp)$/i.test(nm)||(nm+=".png");var mt=blob&&blob.type&&/^image\//.test(blob.type)?blob.type:(/\.jpe?g$/i.test(nm)?"image/jpeg":/\.webp$/i.test(nm)?"image/webp":"image/png");try{return new File([blob],nm,{type:mt,lastModified:Date.now()})}catch(e){var f=blob;try{f.name=nm,f.lastModified=Date.now()}catch(e2){}return f}}
          function libPrefetch(rec){var G=window.GDrivePhoto;if(!G||!G.fetchFile||!rec||libBlobCache[rec.id]||libPrefetching[rec.id])return;libPrefetching[rec.id]=1;G.fetchFile(rec.id).then(function(b){b&&(libBlobCache[rec.id]=libFileOf(rec,b))}).catch(function(){}).then(function(){delete libPrefetching[rec.id]})}
          function libCanShareFiles(files){try{return!!(navigator.canShare&&navigator.share&&files&&files.length&&navigator.canShare({files}))}catch(e){return!1}}
          function libShareFiles(files,title){return navigator.share({files,title:title||"施工照片"})}
          function libLineFallback(recs,why){var body=recs.map(function(r){return r.name+" "+r.link}).join("\n"),url="https://line.me/R/msg/text/?"+encodeURIComponent(body);url.length>1900&&(url="https://line.me/R/msg/text/?"+encodeURIComponent(recs.map(function(r){return r.link}).join("\n"))),window.open(url,"_blank","noopener"),toast((why||"此瀏覽器不支援直接分享圖片")+"，已改為分享連結（"+recs.length+" 張）",!0)}
          C.on($("btnLibLine"),"click",function(){
            var recs=libPickedRecs();if(!recs.length)return;
            var G=window.GDrivePhoto;if(!G||!G.fetchFile){toast("Drive 模組未載入",!0);return}
            var cached=[],missing=[];
            recs.forEach(function(r){libBlobCache[r.id]?cached.push(libBlobCache[r.id]):missing.push(r)});
            if(!missing.length&&libCanShareFiles(cached)){
              libShareFiles(cached,"施工照片（"+cached.length+" 張）").then(function(){toast("已開啟分享，選 LINE 後送出（"+cached.length+" 張照片）")}).catch(function(e){e&&e.name==="AbortError"||libLineFallback(recs,"分享未完成")});
              return;
            }
            var btn=$("btnLibLine");btn&&(btn.disabled=!0);
            libSum&&(libSum.textContent="正在準備 "+recs.length+" 張照片…");
            var out=[],k=0;
            function step(){
              if(k>=recs.length){
                btn&&(btn.disabled=!1);
                libSum&&(libSum.textContent="當日 "+libAll.length+" 張"+(libItem&&libItem.value?"，本工項 "+libVisible().length+" 張":""));
                if(!out.length){toast("照片讀取失敗，無法分享",!0);return}
                if(libCanShareFiles(out)){
                  libShareFiles(out,"施工照片（"+out.length+" 張）").then(function(){toast("已開啟分享，選 LINE 後送出（"+out.length+" 張照片）")}).catch(function(e){e&&e.name==="AbortError"||libLineFallback(recs,"分享未完成")});
                }else{
                  libLineFallback(recs,"此瀏覽器不支援直接分享圖片檔");
                }
                return;
              }
              var r=recs[k];
              libSum&&(libSum.textContent="正在準備第 "+(k+1)+" / "+recs.length+" 張…");
              G.fetchFile(r.id).then(function(b){if(b){var f=libFileOf(r,b);libBlobCache[r.id]=f;out.push(f)}}).catch(function(){}).then(function(){k++;step()});
            }
            step();
          })'''
          s=s[:i]+new+s[j:]
          s=s.replace('}),var libBlobCache={},libPrefetching={};','});var libBlobCache={},libPrefetching={};')
          old='function libUpdateSel(){var n=libCount();libSel&&(libSel.textContent="已選 "+n+" 張");'
          assert s.count(old)==1
          s=s.replace(old,old+'try{libPickedRecs().forEach(function(r){libPrefetch(r)})}catch(e){}')
          old2='libAll=res&&res.records||[],libPicked={},libFillItems()'
          assert s.count(old2)==1
          s=s.replace(old2,'libAll=res&&res.records||[],libPicked={},libBlobCache={},libFillItems()')
          io.open(p,'w',encoding='utf-8').write(s)
          q='build/index.html'
          h=io.open(q,encoding='utf-8').read()
          h=h.replace('<button type="button" class="btn sm" id="btnLibLine">分享到 LINE</button>','<button type="button" class="btn sm" id="btnLibLine">📤 分享照片到 LINE</button>')
          h=h.replace('<div class="libgrid" id="libGrid"></div>','<div class="hintx" id="libShareHint" style="margin:2px 0 8px">勾選照片後按「分享照片到 LINE」，會把照片本身（圖片檔）帶進 LINE 傳送；不支援的瀏覽器才改為分享連結。</div>\n      <div class="libgrid" id="libGrid"></div>')
          io.open(q,'w',encoding='utf-8').write(h)
          print('patched ok')
          PYEOF
          node --check assets/assistant.js
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add assets/assistant.js build/index.html
          git commit -m "施工照片歸檔：分享到 LINE 改為直接分享照片檔（Web Share API，含退回連結）"
          git push
