name: r71e-apply
on:
  push:
    paths:
      - '.github/workflows/r71e-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch assistant.js
        run: |
          set -e
          curl -fsSL --retry 5 --retry-delay 3 -o assets/assistant.js "https://paste.rs/WnkHz"
          wc -c assets/assistant.js
      - name: Verify
        run: |
          set -e
          grep -q 'withTimeout' assets/assistant.js
          grep -q '__buildAutoConnect' assets/assistant.js
          grep -q 'build-assistant-combos-v1' assets/assistant.js
          echo OK
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "fix: 營造助手自動連線加上逾時保護（避免卡在自動連線中）" || echo nothing
          git push origin HEAD:main
      - name: Self delete
        run: |
          git rm -f .github/workflows/r71e-apply.yml || true
          git commit -m "chore: remove one-time workflow" || true
          git push origin HEAD:main || true
