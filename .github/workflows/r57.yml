name: r57 header lock unit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r57.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply
        run: |
          echo '' | base64 -d | gunzip > /tmp/r57_apply.py
          python3 /tmp/r57_apply.py
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "canon8741311@gmail.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "查驗助手：頁首加深 #7a4f4e、查驗單欄位可固定/取消固定、單元位置換行"
          git push origin main
      - name: Self delete
        run: |
          git rm -q .github/workflows/r57.yml
          git commit -m "chore: remove one-time r57 workflow"
          git push origin main
