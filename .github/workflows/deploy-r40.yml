name: deploy-r40
on:
  push:
    paths:
      - '.deploy-r40/trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply files
        run: bash .deploy-r40/apply.sh
      - name: Commit
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add photo/index.html photo/photobuilder.js
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "photo: 本頁說明一鍵複製到下一頁、拍攝編號可留空、歸檔選擇改縮圖格狀並預選已加入"
            git push origin main
          fi
