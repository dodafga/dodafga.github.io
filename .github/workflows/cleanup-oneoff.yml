name: cleanup-oneoff
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: remove one-off workflows
        run: |
          git config user.name "dodafga"
          git config user.email "132368659+dodafga@users.noreply.github.com"
          rm -f .github/workflows/restore-drive-v2.yml
          rm -f .github/workflows/cleanup-oneoff.yml
          git add -A .github/workflows
          git diff --cached --quiet && echo "nothing" || git commit -m "chore: remove one-off workflows"
          git push
