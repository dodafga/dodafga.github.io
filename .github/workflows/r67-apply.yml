name: r67 apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r67-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download new files
        run: |
          set -e
          mkdir -p /tmp/in
          B="https://static.teamily.ai/sites/75412899-747e-4617-ad54-32193918a0c6/documents/r67-deploy"
          TK="tk=c2l0ZTo3NTQxMjg5OS03NDdlLTQ2MTctYWQ1NC0zMjE5MzkxOGEwYzYvZG9jdW1lbnRzL3I2Ny1kZXBsb3k6MTc5NTUyNTQxMA.NzMzODhkMmM4NzRiODU2NzU1ZDNlZjU1MjA3NDNiNmE"
          for f in drive_index.html drive-v2.js cam.css cam.js build_index.html assistant.js form_index.html root_index.html; do
            curl -fsSL -o "/tmp/in/$f" "$B/$f?$TK"
          done
          ls -l /tmp/in

      - name: Verify content markers
        run: |
          set -e
          cd /tmp/in
          wc -c *
          grep -q 'html.camopen header' drive_index.html
          grep -q 'camopen' drive-v2.js
          grep -q 'renderWb' drive-v2.js
          grep -q 'wbnote' drive-v2.js
          grep -q 'cam.css' drive_index.html
          grep -q 'camModal' build_index.html
          grep -q 'cam.css' build_index.html
          grep -q 'cam.js' build_index.html
          grep -q 'SiteCam' assistant.js
          grep -q 'html.camopen' cam.css
          grep -q 'CAM_DET' cam.js
          grep -q 'camSliderToZoom' cam.js
          grep -q 'fAttTitle' form_index.html
          grep -q 'var ORDER = \["form","drive","photo","log","progress"\]' root_index.html
          python3 -c "import re,io; s=io.open('drive_index.html',encoding='utf-8').read(); seg=s[s.index('id=\"p-photo\"'):]; hs=[re.sub(r'<[^>]+>','',h).strip() for h in re.findall(r'<h2>(.*?)</h2>',seg,re.S)][:5]; print('H2:',hs); assert hs==['照片上傳','設定歸檔資料','記錄小白板資料','暫存','已上傳'], hs; print('card order OK')"
          python3 -c "import re,io; s=io.open('form_index.html',encoding='utf-8').read(); m=re.search(r'var LOCK_FIELDS = \[(.*?)\];',s,re.S); n=len(re.findall(r'key:\"',m.group(1))); print('LOCK_FIELDS:',n); assert n==15, n; print('lock fields OK')"
          echo "markers OK"

      - name: Apply
        run: |
          set -e
          cp /tmp/in/drive_index.html drive/index.html
          cp /tmp/in/drive-v2.js      assets/drive-v2.js
          cp /tmp/in/cam.css          assets/cam.css
          cp /tmp/in/cam.js           assets/cam.js
          cp /tmp/in/build_index.html build/index.html
          cp /tmp/in/assistant.js     assets/assistant.js
          cp /tmp/in/form_index.html  form/index.html
          cp /tmp/in/root_index.html  index.html
          node --check assets/drive-v2.js
          node --check assets/assistant.js
          node --check assets/cam.js
          git config user.name  "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add drive/index.html assets/drive-v2.js assets/cam.css assets/cam.js build/index.html assets/assistant.js form/index.html index.html
          git commit -m "feat: 相機全螢幕蓋掉頁首、營造助手站內相機、查驗單每欄可固定、頁面排序、歸檔流程重排"
          git push origin HEAD:main

      - name: Self delete workflow
        if: always()
        run: |
          set -e
          git pull --rebase origin main || true
          git rm -f .github/workflows/r67-apply.yml || true
          git commit -m "chore: remove one-off r67 workflow" || true
          git push origin HEAD:main || true
