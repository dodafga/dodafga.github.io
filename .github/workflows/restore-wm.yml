name: wmfix
on:
  push:
    paths:
      - '.github/workflows/restore-wm.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -o /tmp/d.js "https://static.teamily.ai/files/dd98fec6-fa0e-4541-a988-3ecc1ff1e201/drive-v2.js"
          stat -c%s /tmp/d.js
          echo "a23ef80ad23bc90bb5cc1d4a253bf2c17ff043e11e3bb896c2abacd911f7444a  /tmp/d.js" | sha256sum -c -
          cp /tmp/d.js assets/drive-v2.js
          node -e "new Function(require('fs').readFileSync('assets/drive-v2.js','utf8'));console.log('syntax OK')"
          git config user.name dodafga
          git config user.email 132368659+dodafga@users.noreply.github.com
          git add assets/drive-v2.js
          git commit -m "fix(drive): restore F-24-03 watermark format"
          git push
