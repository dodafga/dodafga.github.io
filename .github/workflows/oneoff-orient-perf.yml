name: oneoff-orient-perf
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oneoff-orient-perf.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore baseline then patch
        run: |
          git show abca188:assets/orient.js > assets/orient.js
          curl -fsSL -o /tmp/patch.py "https://static.teamily.ai/files/cf6e37b0-d89c-4636-b283-ffdf86d7413c/patch.py"
          wc -c /tmp/patch.py
          python3 /tmp/patch.py
          node -e "new Function(require('fs').readFileSync('assets/orient.js','utf8')); console.log('syntax ok')"
          grep -c "_grayCv" assets/orient.js
      - name: Commit
        run: |
          git config user.name dodafga
          git config user.email dodafga@users.noreply.github.com
          git diff --stat
          git add -A
          git commit -m "perf(orient): remove dead glyph-stats compute, run-based CCL, reuse canvas, int buffers"
          git push origin HEAD:main
      - name: Self remove
        run: |
          git rm -f .github/workflows/oneoff-orient-perf.yml
          git commit -m "chore: remove one-off workflow"
          git push origin HEAD:main
