name: r72-apply
on:
  push:
    paths:
      - '.github/workflows/r72-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and place files
        run: |
          set -e
          mkdir -p drive progress assets
          fetch() { curl -fsSL --retry 3 --retry-delay 2 -o "$2" "$1"; echo "  $2 $(wc -c < "$2")"; }
          fetch "https://static.teamily.ai/files/f80f6275-af3b-44b0-83c4-e830ecc1d73a/index.html" drive/index.html
          fetch "https://static.teamily.ai/files/35bb86e4-5e7a-4b6a-a2b3-b135083beeac/index.html" progress/index.html
          fetch "https://static.teamily.ai/files/92f57cec-0c22-4ef7-92af-b78f9f1d6b20/daily-flow.js" assets/daily-flow.js
          fetch "https://static.teamily.ai/files/0f9cbc00-e141-4706-b515-0b6f560803c9/pile-measure.js" assets/pile-measure.js
      - name: Verify content markers
        run: |
          set -e
          chk() { grep -q "$2" "$1" || { echo "MISSING in $1: $2"; exit 1; }; echo "  ok $1"; }
          chk drive/index.html 'dailyMount'
          chk drive/index.html 'pmMount'
          chk drive/index.html 'pile-measure.js'
          chk drive/index.html 'daily-flow.js'
          if grep -q 'recMount' drive/index.html; then echo "recMount still in drive"; exit 1; fi
          echo "  ok drive has no recMount"
          chk progress/index.html 'recMount'
          chk progress/index.html 'daily-flow.js'
          chk progress/index.html 'pmqMount'
          chk assets/daily-flow.js 'DailyFlow'
          chk assets/daily-flow.js 'recTag'
          chk assets/pile-measure.js 'PileMeasure'
          chk assets/pile-measure.js 'dailyStaff'
          if grep -q 'pmInspector' assets/pile-measure.js; then echo "pmInspector still present"; exit 1; fi
          echo "  ok pile-measure has no pmInspector"
          echo "ALL MARKERS OK"
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "查驗紀錄區塊移至進度表第一個區塊；樁位資料表移除查驗/監造人員欄位（沿用今日查驗人員）" || echo "nothing to commit"
          git push origin HEAD:main
      - name: Self delete
        run: |
          git rm -f .github/workflows/r72-apply.yml || true
          git commit -m "chore: remove one-time workflow" || true
          git push origin HEAD:main || true
