name: Apply v10 patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-v10.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download patch
        run: |
          set -euo pipefail
          URL='https://static.teamily.ai/sites/37eb832d-9280-41aa-bf49-25ff6910a93a/documents/inspection-suite-v10-patch/patch-v10.zip?tk=c2l0ZTozN2ViODMyZC05MjgwLTQxYWEtYmY0OS0yNWZmNjkxMGE5M2EvZG9jdW1lbnRzL2luc3BlY3Rpb24tc3VpdGUtdjEwLXBhdGNoOjE3OTQzNzI2MTM.YmVmNGJmMzJhNjdjZDIzOTg3OTMzNTlhMmM5YjljMjc'
          curl -fsSL --retry 3 -o /tmp/patch.zip "$URL"
          ls -la /tmp/patch.zip
          unzip -o -q /tmp/patch.zip -d "$GITHUB_WORKSPACE"
          echo '--- files now:'
          find . -path ./.git -prune -o -type f -print | sort

      - name: Verify patch landed
        run: |
          set -euo pipefail
          wc -c assets/store.js progress/index.html log/index.html index.html
          head -c 60 assets/store.js
          test -s progress/index.html
          test -s assets/store.js

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'dodafga'
          git config user.email 'canon8741311@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m '修正 store.js 並套用預壘樁進度管控表（/progress/）+ 查驗紀錄表墩號聯動'
            git push
          fi

      - name: Remove this workflow
        run: |
          set -euo pipefail
          git rm -q .github/workflows/apply-v10.yml || true
          git commit -m '移除一次性匯入 workflow' || true
          git push || true
