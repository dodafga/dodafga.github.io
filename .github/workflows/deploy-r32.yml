name: deploy-r32

on:
  push:
    paths:
      - '.deploy-r32/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download new log/index.html
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 -o /tmp/new_log.html https://paste.rs/lftwd
          echo "downloaded bytes: $(wc -c < /tmp/new_log.html)"
          echo "sha256: $(sha256sum /tmp/new_log.html | cut -d' ' -f1)"
          EXPECT=10fed58c8b43260baf9a838e33bf02b9dc107d2b3b1424260015a6d8e230ba87
          GOT=$(sha256sum /tmp/new_log.html | cut -d' ' -f1)
          if [ "$GOT" != "$EXPECT" ]; then echo "HASH MISMATCH"; exit 1; fi
          cp /tmp/new_log.html log/index.html

      - name: Commit and push
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add log/index.html
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "feat(log): search block always lists records when no query is entered"
            git push origin HEAD:main
            echo "pushed: $(git rev-parse --short HEAD)"
          fi
