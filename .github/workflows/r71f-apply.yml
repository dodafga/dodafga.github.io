name: r71f-apply
on:
  push:
    paths:
      - '.github/workflows/r71f-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch log redirect
        run: |
          set -e
          curl -fsSL --retry 5 --retry-delay 3 -o log/index.html "https://paste.rs/5Ld4M"
          wc -c log/index.html
      - name: Verify
        run: |
          set -e
          grep -q '紀錄表已整合到' log/index.html
          grep -q '../drive/' log/index.html
          echo OK
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "feat: 紀錄表頁轉址到相片歸檔（紀錄已整合）" || echo nothing
          git push origin HEAD:main
      - name: Self delete
        run: |
          git rm -f .github/workflows/r71f-apply.yml || true
          git commit -m "chore: remove one-time workflow" || true
          git push origin HEAD:main || true
