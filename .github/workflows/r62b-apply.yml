name: r62b apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r62b-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch files
        run: |
          set -e
          curl -fsSL https://paste.rs/poBGE -o index.html
          curl -fsSL https://paste.rs/66GoP -o drive/index.html
          curl -fsSL https://paste.rs/J0bAY -o assets/drive-v2.js
          curl -fsSL https://paste.rs/qIbYQ -o assets/drive-v2.css
          wc -c index.html drive/index.html assets/drive-v2.js assets/drive-v2.css
          sha256sum index.html drive/index.html assets/drive-v2.js assets/drive-v2.css
          node --check assets/drive-v2.js
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "canon8741311@gmail.com"
          git add index.html drive/index.html assets/drive-v2.js assets/drive-v2.css
          git commit -m "查驗助手：相片上傳歸檔改版為施工照片歸檔（拍照／本機上傳分開、本機相機連拍多張、每張各自說明）" || echo "no change"
          git push
      - name: Self delete
        run: |
          git rm .github/workflows/r62b-apply.yml
          git commit -m "chore: remove one-time r62b workflow"
          git push
