name: deploy-r37
on:
  push:
    paths:
      - '.deploy-r37/trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .deploy-r37/apply.sh
      - run: |
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add drive/index.html assets/drive-v2.js
          git commit -m "drive: 日期篩選預設開啟（首次載入即勾選，手動取消仍會記住）"
          git push origin HEAD:main
