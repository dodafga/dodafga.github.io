name: r72d-apply
on:
  push:
    paths:
      - '.github/workflows/r72d-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and place
        run: |
          set -e
          curl -fsSL --retry 3 -o assets/assistant.js "https://paste.rs/Yur8U"
          echo "  assistant.js $(wc -c < assets/assistant.js)"
      - name: Verify
        run: |
          set -e
          grep -q 'hasTok' assets/assistant.js || { echo "missing hasTok"; exit 1; }
          grep -q 'withTimeout(p,3500)' assets/assistant.js || { echo "missing timeout"; exit 1; }
          node --check assets/assistant.js
          echo "ALL OK"
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "營造助手：自動連線雲端改為先檢查授權、無授權立即顯示未授權（不再空等重試）" || echo "nothing"
          git push origin HEAD:main
      - name: Self delete
        run: |
          git rm -f .github/workflows/r72d-apply.yml || true
          git commit -m "chore: remove one-time workflow" || true
          git push origin HEAD:main || true
