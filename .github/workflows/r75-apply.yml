name: r75-apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r75-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download bundle
        run: |
          set -e
          curl -sSL -o /tmp/r75.tgz "https://n.uguu.se/lLoPOwPUkmRZ.tgz"
          echo "1dc0711915ecc22dd9cc15faf2f39666dc6d63e57a9ef13f8e4d6e93bfac18a2  /tmp/r75.tgz" | sha256sum -c -
      - name: Extract
        run: |
          set -e
          tar xzf /tmp/r75.tgz -C .
          grep -q "pmCacheToggle" assets/pile-measure.js
          grep -q "finalizePhotoDate" assets/gdrive-photo.js
          grep -q "lockPage" assets/zoomlock.js
          grep -q "cementSide" progress/index.html
          grep -q "pendList" drive/index.html
          echo "content markers OK"
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "feat: pending-date archive, material left/right bank, page zoom lock, pile cache hidden"; fi
          git push origin HEAD:main
      - name: Self delete
        if: always()
        run: |
          git rm -f .github/workflows/r75-apply.yml || true
          git commit -m "chore: remove one-off r75 workflow" || true
          git push origin HEAD:main || true
