name: deploy-r38
on:
  push:
    paths:
      - '.deploy-r38/trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .deploy-r38/apply.sh
      - run: |
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add assets/drive-v2.js assets/drive-v2.css
          git commit -m "fix(drive): EXIF date first for date filter"
          git push origin HEAD:main
