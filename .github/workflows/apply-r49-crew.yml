name: apply-r49-crew
on:
  push:
    paths:
      - '.github/workflows/apply-r49-crew.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch new files and commit
        run: |
          set -e
          curl -fsSL -o assets/site.css "https://static.teamily.ai/files/9096cb63-5ba5-46f2-affa-a97c763e1c89/site.css"
          wc -c assets/site.css
          grep -c "crewrow" assets/site.css
          grep -c "white-space:normal" assets/site.css
          git config user.email "agent@teamily.ai"
          git config user.name "Teamily Agent"
          git add -A
          git commit -m "style: 已上傳照片的工種/機具標籤改為可換行完整顯示"
          git push
      - name: Self-delete this one-time workflow
        run: |
          set -e
          git rm .github/workflows/apply-r49-crew.yml
          git commit -m "chore: remove one-time workflow"
          git push
