name: restore-supabase-sync
on:
  push:
    paths:
      - '.github/workflows/restore-supabase-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch verified supabase-sync.js from public store
        run: |
          set -e
          curl -fsSL -o /tmp/row.json \
            "https://ohwrzcrmdmqnxbxjfuus.supabase.co/rest/v1/app_state?select=value&key=eq.__deploy__supabase-sync" \
            -H "apikey: sb_publishable_QRBZ59wj7F4iTJTCraJzHQ_SvL8AbMv" \
            -H "Authorization: Bearer sb_publishable_QRBZ59wj7F4iTJTCraJzHQ_SvL8AbMv"
          echo "--- fetched ---"
          wc -c /tmp/row.json
          python3 -c "
import json
rows = json.load(open('/tmp/row.json'))
assert rows, 'no row'
v = rows[0]['value']
assert isinstance(v, dict) and v.get('t') == 's', 'bad shape'
open('assets/supabase-sync.js','w',encoding='utf-8').write(v['v'])
print('written bytes:', len(v['v']))
"
          echo "--- guards ---"
          wc -c assets/supabase-sync.js
          if grep -q "__PLACEHOLDER__" assets/supabase-sync.js; then echo "ERROR placeholder"; exit 1; fi
          if [ "$(wc -c < assets/supabase-sync.js)" -lt 5000 ]; then echo "ERROR too small"; exit 1; fi
          node --check assets/supabase-sync.js
          echo "SYNTAX OK"
          head -c 100 assets/supabase-sync.js

      - name: Commit
        run: |
          set -e
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add assets/supabase-sync.js
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "fix: 還原 assets/supabase-sync.js 真實內容（前次誤送佔位字串）"
            git push origin main
          fi

      - name: Self-remove
        run: |
          set -e
          git rm -q .github/workflows/restore-supabase-sync.yml
          git commit -m "chore: 移除一次性還原 workflow"
          git push origin main
