name: fix-indent-v15

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore block
        run: |
          python3 - <<'PY'
          import io, base64, sys
          CHUNK = base64.b64decode("").decode('utf-8')
          p = 'assets/store.js'
          s = io.open(p, encoding='utf-8').read()
          a = s.find('  /* ---------------- \u6392\u5e8f ---------------- */')
          b = s.find('  /* ---------------- JSON \u532f\u51fa\uff0f\u532f\u5165 ---------------- */')
          if a < 0 or b < 0 or b <= a:
              sys.stderr.write('anchors not found a=%d b=%d\n' % (a, b))
              sys.exit(1)
          s = s[:a] + CHUNK + s[b:]
          io.open(p, 'w', encoding='utf-8', newline='').write(s)
          print('store.js block restored, %d bytes' % len(s))
          PY

      - name: Verify
        run: |
          node --check assets/store.js
          echo "syntax OK"
          grep -n "function sortPiles" assets/store.js
          grep -c "mode === 'inspect'" assets/store.js

      - name: Cleanup and push
        run: |
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          rm -f .github/workflows/fix-indent-v15.yml
          rm -f .github/workflows/patch-v15.yml
          git add -A
          git commit -m "style(store): 還原 sortPiles 段落縮排（功能不變）"
          git push
