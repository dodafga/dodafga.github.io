name: fix-form-index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-form-index.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch patched index.html
        run: |
          curl -sSL --fail -o form/index.html "https://static.teamily.ai/files/c7ae1c2b-19d3-4601-929f-3bb195e009cd/index.html?tk=ZmlsZTpjN2FlMWMyYi0xOWQzLTQ2MDEtOTI5Zi0zYmIxOTVlMDA5Y2Q6MTc5NDQxNjM5Mw.ZThlMGY5N2U5ZmJhZjFjMDMxMTY2NDg1Y2IwM2JlZDc"
          wc -c form/index.html
          grep -c "查驗基本資料" form/index.html || echo "no-block-ok"
      - name: Commit
        run: |
          git config user.name dodafga
          git config user.email dodafga@users.noreply.github.com
          git add form/index.html
          git commit -m "fix(form): 移除查驗基本資料區塊，契約項次／名稱帶入附件表單第一列" || echo nothing
          git push
