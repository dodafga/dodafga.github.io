name: apply-fix
on:
  push:
    paths:
      - '.github/workflows/apply-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and apply
        run: |
          set -e
          curl -sSL -o /tmp/watermark.js 'https://static.teamily.ai/sites/37eb832d-9280-41aa-bf49-25ff6910a93a/documents/f24fix/watermark.js'
          curl -sSL -o /tmp/formbuilder.js 'https://static.teamily.ai/sites/37eb832d-9280-41aa-bf49-25ff6910a93a/documents/f24fix/formbuilder.js'
          cp /tmp/watermark.js assets/watermark.js
          cp /tmp/formbuilder.js form/formbuilder.js
          node --check assets/watermark.js
          node --check form/formbuilder.js
          git config user.name 'dodafga'
          git config user.email 'dodafga@users.noreply.github.com'
          git add assets/watermark.js form/formbuilder.js
          git commit -m 'fix: F-24-03 查驗單逐段對齊範本 + 浮水印比例依範本量測校正'
          git push
      - name: Self cleanup
        run: |
          git rm -q .github/workflows/apply-fix.yml
          git commit -m 'chore: remove one-off workflow'
          git push
