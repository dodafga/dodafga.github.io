name: r74-apply
# trigger: 2026-11-25T03:25Z rerun after patch script landed
on:
  push:
    paths:
      - '.github/workflows/r74-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .r74/patch74.py .
      - name: Verify
        run: |
          set -e
          grep -q 'drive-offline-v5' sw-ocr.js
          grep -q "if (req.mode === 'navigate') return;" sw-ocr.js
          grep -q 'sw-selfheal-v5' drive/index.html
          grep -q 'apple-mobile-web-app-capable' drive/index.html
          node --check sw-ocr.js
          echo VERIFY_OK
      - name: Commit
        run: |
          git config user.name "r74-bot"
          git config user.email "r74-bot@users.noreply.github.com"
          git add sw-ocr.js drive/index.html
          git commit -m "fix(drive): iOS standalone hardening (SW never intercepts navigations; one-time self-heal)"
          git push
      - name: Self delete
        run: |
          git rm .github/workflows/r74-apply.yml
          git rm -r .r74
          git commit -m "chore: remove one-off r74 workflow and patch"
          git push
