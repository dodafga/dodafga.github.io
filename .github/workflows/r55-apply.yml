name: r55 apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r55-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -e
          TK="tk=c2l0ZTo3NTQxMjg5OS03NDdlLTQ2MTctYWQ1NC0zMjE5MzkxOGEwYzY6MTc5NTI0MTY4NA.Yzg5ZDYxZjFkZDUwYjdjYmY5MmI5MTNmMTc2ODc0YjQ"
          curl -fsSL -o assets/site.css "https://static.teamily.ai/sites/75412899-747e-4617-ad54-32193918a0c6/documents/site/site.css?$TK"
          curl -fsSL -o assets/assistant.js "https://static.teamily.ai/sites/75412899-747e-4617-ad54-32193918a0c6/documents/assistant/assistant.js?$TK"
          curl -fsSL -o build/index.html "https://static.teamily.ai/sites/75412899-747e-4617-ad54-32193918a0c6/documents/index/index.html?$TK"
          echo "--- sizes ---"
          wc -c assets/site.css assets/assistant.js build/index.html
          echo "--- sha ---"
          sha256sum assets/site.css assets/assistant.js build/index.html
          echo "--- sanity ---"
          grep -c "暫存區" build/index.html
          grep -c "btnStageLine" assets/assistant.js
          node --check assets/assistant.js
      - name: Commit
        run: |
          set -e
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add assets/site.css assets/assistant.js build/index.html
          git commit -m "版面重整：莫蘭迪配色、手機優先、暫存區（分享前先載入）" || echo "nothing to commit"
          git push
