name: r71b-apply
on:
  push:
    paths:
      - '.github/workflows/r71b-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and place files
        run: |
          set -e
          mkdir -p drive progress form build assets
          B="https://static.teamily.ai/sites/75412899-747e-4617-ad54-32193918a0c6/documents/r71-deploy"
          fetch() { curl -fsSL --retry 4 --retry-delay 3 -o "$2" "$1"; echo "  $2 $(wc -c < "$2")"; }
          fetch "$B/index.html" index.html
          fetch "$B/drive_index.html" drive/index.html
          fetch "$B/progress_index.html" progress/index.html
          fetch "$B/form_index.html" form/index.html
          fetch "$B/build_index.html" build/index.html
          fetch "$B/assets_pile-measure.js" assets/pile-measure.js
          fetch "$B/assets_daily-flow.js" assets/daily-flow.js
          fetch "$B/assets_drive-v2.js" assets/drive-v2.js
          fetch "$B/assets_assistant.js" assets/assistant.js
          fetch "$B/assets_site.css" assets/site.css
          fetch "$B/assets_cam.css" assets/cam.css
      - name: Verify content markers
        run: |
          set -e
          chk() { grep -q "$2" "$1" || { echo "MISSING in $1: $2"; exit 1; }; echo "  ok $1"; }
          chk index.html 'data-mode="progress"'
          chk drive/index.html 'dailyMount'
          chk drive/index.html 'pmMount'
          chk drive/index.html 'recMount'
          chk drive/index.html 'pile-measure.js'
          chk drive/index.html 'daily-flow.js'
          chk progress/index.html 'pmqMount'
          chk progress/index.html 'pile-measure.js'
          chk form/index.html 'formmobile'
          chk build/index.html 'comboList'
          chk build/index.html 'comboEmpty'
          chk assets/pile-measure.js 'PileMeasure'
          chk assets/daily-flow.js 'DailyFlow'
          chk assets/drive-v2.js 'stationsForDate'
          chk assets/assistant.js 'build-assistant-combos-v1'
          chk assets/assistant.js '__buildAutoConnect'
          chk assets/cam.css 'camwrap:not(.on)'
          chk assets/site.css 'crewhint'
          echo "ALL MARKERS OK"
      - name: Commit
        run: |
          set -e
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "查驗助手三頁聯動：今日查驗人員固定、逐樁紀錄、完成寫入紀錄表；樁位資料表移至相片歸檔、樁位資料查詢移至進度；移除紀錄表頁；手機優先版面；營造助手自動連線與常用項目" || echo "nothing to commit"
          git push origin HEAD:main
      - name: Self delete
        run: |
          git rm -f .github/workflows/r71b-apply.yml .github/workflows/r71-apply.yml || true
          git commit -m "chore: remove one-time workflow" || true
          git push origin HEAD:main || true
