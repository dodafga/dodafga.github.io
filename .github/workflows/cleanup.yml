name: cleanup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-off workflows
        run: |
          git config user.name dodafga
          git config user.email dodafga@users.noreply.github.com
          git rm -f .github/workflows/fix-form-index.yml .github/workflows/fix-formbuilder.yml .github/workflows/restore-form.yml .github/workflows/cleanup.yml || true
          git commit -m "chore: 移除一次性 workflow" || echo nothing
          git push
