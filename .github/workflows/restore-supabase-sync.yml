name: restore-supabase-sync
on:
  push:
    paths:
      - '.github/workflows/restore-supabase-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write verified supabase-sync.js
        run: |
          set -e
          cat > /tmp/b64.txt <<'B64EOF'
Lyogc3VwYWJhc2Utc3luYy5qcyDigJQg5YWo56uZ6LOH5paZ6Zuy56uv5ZCM5q2l77yIU3VwYWJh
c2XvvIkKICoKICog55uu55qE77ya6K6T5omL5qmf6IiH6Zu76IWm55yL5Yiw5ZCM5LiA5Lu96LOH
B64EOF
          base64 -d /tmp/b64.txt > assets/supabase-sync.js
          wc -c assets/supabase-sync.js
