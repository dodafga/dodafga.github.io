name: deploy-r25
on:
  push:
    paths:
      - '.deploy-r25/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply log patch
        run: |
          set -e
          python3 .deploy-r25/patch_log.py log/index.html
          node --check sw-ocr.js
          grep -q "drive-offline-v3" sw-ocr.js
          grep -q "optDone" log/index.html
          grep -q "pPileLegend" log/index.html
          echo "ALL VERIFIED"
      - name: Commit
        run: |
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add log/index.html sw-ocr.js
          git commit -m "feat(log): filed/unfiled pile markers in pile table" || echo "nothing to commit"
          git push
