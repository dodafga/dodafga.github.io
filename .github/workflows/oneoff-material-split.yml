name: oneoff-material-split
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oneoff-material-split.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore good store.js then apply patch
        run: |
          set -e
          git checkout bfd82bdc -- assets/store.js progress/index.html
          echo "restored store.js: $(wc -c < assets/store.js) bytes"
          git apply --check -p1 /tmp/mat_split.patch || true
          echo "(patch applied in next step)"

      - name: Fetch patch from artifact and apply
        run: |
          set -e
          curl -fsSL -o /tmp/mat_split.patch "$PATCH_URL"
          echo "patch bytes: $(wc -c < /tmp/mat_split.patch)"
          git apply --check -p1 /tmp/mat_split.patch
          git apply -p1 /tmp/mat_split.patch
          echo "--- verify ---"
          echo "store.js: $(wc -c < assets/store.js) bytes"
          grep -c "materialRowsByType" assets/store.js
          grep -c "materialRowsByType" progress/index.html
          node --check assets/store.js
          git config user.name "dodafga"
          git config user.email "dodafga@users.noreply.github.com"
          git add -A
          git commit -m "fix(progress): restore store.js from bfd82bdc + material-split patch"
          git push
        env:
          PATCH_URL: https://static.teamily.ai/files/PLACEHOLDER.mat_split.patch

      - name: Self delete workflow
        if: always()
        run: |
          git pull --rebase || true
          git rm -f .github/workflows/oneoff-material-split.yml || true
          git commit -m "chore: remove one-off workflow" || true
          git push || true
